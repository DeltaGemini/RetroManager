<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="RetroManager">
  <!-- RetroManager's icon (tools/make_icon.py): a cartridge, with RM in the logo's block letters -->
