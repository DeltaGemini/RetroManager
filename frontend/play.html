<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RetroManager Play</title>
    <script src="/common/theme.js"></script>
    <script src="/common/language-packs.js"></script>
    <script src="/common/language.js"></script>
    <script src="/common/accounts.js"></script>
    <link rel="stylesheet" href="/common/header.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        /* Same palette as the library page (index.html) */
        :root {
            color-scheme: dark;
            --bg-primary: #0a0e27; --bg-secondary: #0f1535; --bg-tertiary: #14194f;
            --text-primary: #e0e0e0; --text-secondary: #999999;
            --accent-pink: #ff6b9d; --accent-orange: #ff9d3d; --success: #6bd09a; --border-color: #2a2d4a;
        }
        :root[data-theme="light"] {
            color-scheme: light;
            --bg-primary: #f4f5fb; --bg-secondary: #ffffff; --bg-tertiary: #eceef7;
            --text-primary: #1c1f33; --text-secondary: #5f6480;
            --accent-pink: #d6336c; --accent-orange: #c2560c; --success: #1e8a55; --border-color: #d3d7e8;
        }
        html, body { height: 100%; }
        body {
            background: var(--bg-primary); color: var(--text-primary); display: flex; flex-direction: column;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Ubuntu', 'Helvetica Neue', sans-serif;
        }
        .bar {
            display: flex; gap: 12px; align-items: center; flex-wrap: wrap; padding: 10px 16px; font-size: 13px;
            background: var(--bg-secondary); border-bottom: 1px solid var(--border-color);
        }
        .bar a { color: var(--accent-pink); text-decoration: none; }
        .bar h1 { font-size: 16px; flex: 1; min-width: 160px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        #pi-load, #pi-send { max-width: 230px; }
        /* Full screen: the bar is put away, and a small button in the corner brings it back */
        body.fs .bar { display: none; }
        body.fs.bar-open .bar { display: flex; }
        #bar-toggle {
            position: fixed; left: 6px; top: 6px; z-index: 20; width: 30px; height: 30px; border-radius: 50%; padding: 0; cursor: pointer;
            font-size: 15px; line-height: 1; color: #fff; background: rgba(0, 0, 0, 0.45); border: 1px solid rgba(255, 255, 255, 0.35); opacity: 0.55;
        }
        body.fs.bar-open #bar-toggle { top: auto; bottom: 6px; }
        /* Touch controls drawn from a RetroArch overlay (play-overlay.js): they cover
           the game, and only the controls themselves take touches */
        #stage { position: relative; }
        .rm-pad { position: absolute; inset: 0; z-index: 5; pointer-events: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
        .rm-pad-ctl { position: absolute; pointer-events: auto; touch-action: none; opacity: 0.8; }
        .rm-pad-ctl.still { pointer-events: none; }
        .rm-pad-ctl img { width: 100%; height: 100%; display: block; pointer-events: none; }
        .rm-pad-ctl.down { opacity: 1; filter: brightness(1.5); }
        /* EmulatorJS's own touch pad makes way for it */
        body.rm-pad-on .ejs_virtualGamepad_parent { display: none !important; }
        /* EmulatorJS's menu button keeps its menu bar open until it's pressed again (pinMenuBar) */
        body.rm-menu-pinned .ejs_menu_bar.ejs_menu_bar_hidden { opacity: 1 !important; pointer-events: auto !important; transform: none !important; }
        body.rm-menu-pinned .ejs_small_screen .ejs_menu_bar.ejs_menu_bar_hidden { transform: translate(-50%, 0) !important; }
        body.rm-menu-pinned .ejs_virtualGamepad_open { opacity: 1 !important; }
        .rm-menu-button { opacity: 0.5; cursor: pointer; }
        .rm-menu-button:hover, .rm-menu-button:focus-visible { opacity: 0.9; }
        /* Once the game is on, the bar keeps only what's still of use, on one line where it fits */
        body.playing #profile, body.playing #profile-label, body.playing #start { display: none; }
        body.playing .bar { padding: 6px 12px; gap: 8px; }
        body.playing .bar h1 { font-size: 14px; min-width: 60px; }
        #pad-row { margin-top: 14px; font-size: 13px; }
        #pad-row select { font: inherit; color: #eee; background: #15151c; border: 1px solid #2c2c38; border-radius: 4px; padding: 6px 10px; margin-left: 6px; max-width: 100%; }
        .bar select, .bar button {
            font: inherit; color: var(--text-primary); background: var(--bg-tertiary); border: 1px solid var(--border-color);
            border-radius: 4px; padding: 6px 10px; cursor: pointer;
        }
        .bar button.primary { background: var(--accent-pink); border-color: var(--accent-pink); color: #fff; font-weight: 600; }
        .bar button:disabled { opacity: 0.5; cursor: default; }
        #status { color: var(--text-secondary); font-size: 12px; }
        #status.error { color: var(--accent-pink); }
        #stage { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; background: #000; }
        #game { width: 100%; height: 100%; }
        #intro { max-width: 560px; padding: 24px; text-align: center; color: #ddd; line-height: 1.6; font-size: 14px; }
        #intro p { margin-bottom: 12px; }
        #intro .small { font-size: 12px; color: #999; }
        /* Save states made on the Pi (RetroArch) that this game can start from */
        #stage.with-states { align-items: flex-start; overflow-y: auto; }
        #pi-states { margin-top: 18px; text-align: left; }
        #pi-states h2 { font-size: 14px; margin-bottom: 4px; color: #eee; }
        .pi-list { display: flex; flex-direction: column; gap: 4px; margin-top: 8px; }
        .pi-state {
            display: flex; gap: 10px; align-items: center; width: 100%; text-align: left; padding: 6px 8px; cursor: pointer;
            font: inherit; font-size: 13px; color: #ddd; background: #15151c; border: 1px solid #2c2c38; border-radius: 4px;
        }
        .pi-state:hover { border-color: #666; }
        .pi-state[aria-checked="true"] { border-color: var(--accent-pink); background: #24161f; }
        .pi-state img, .pi-state .no-shot { width: 64px; height: 48px; flex-shrink: 0; border-radius: 3px; object-fit: cover; background: #000; image-rendering: pixelated; }
        .pi-state .no-shot { display: flex; align-items: center; justify-content: center; font-size: 18px; }
        .pi-state b { display: block; font-weight: 600; }
        .pi-state span.small { display: block; }
        .pi-more { align-self: flex-start; font: inherit; font-size: 12px; color: #ddd; background: none; border: 1px solid #2c2c38; border-radius: 4px; padding: 4px 9px; cursor: pointer; margin-top: 4px; }
    </style>
</head>
<body>
    <div class="bar">
        <a id="back" href="/">← Back</a>
        <h1 id="title">Loading...</h1>
        <label for="profile" id="profile-label" hidden>Play as</label>
        <select id="profile" hidden aria-label="Whose save to use"></select>
        <button id="start" class="primary" disabled>Start</button>
        <select id="pi-load" hidden aria-label="Load a save state made on the Pi"></select>
        <select id="pi-send" hidden aria-label="Send this moment to the Pi as a save state"></select>
        <button id="fullscreen" hidden title="Fill the screen (the bar comes back with the button in the corner)">⛶ Full screen</button>
        <span id="status" role="status"></span>
    </div>
    <button id="bar-toggle" hidden aria-label="Show or hide the bar" title="Show or hide the bar">☰</button>
    <div id="stage">
        <div id="intro"></div>
        <div id="game" hidden></div>
    </div>

    <script src="/play-overlay.js"></script>
    <script src="/play.js"></script>
</body>
</html>
