                loadSystems();
                loadStats();
            };

            useEffect(() => {
                // Browser refresh/close with unsaved edits
                const warn = (e) => {
                    if (detailStateRef.current.dirty) { e.preventDefault(); e.returnValue = ''; }
                };
                window.addEventListener('beforeunload', warn);
                return () => window.removeEventListener('beforeunload', warn);
            }, []);

            const handleSystemSelect = (system) => guardUnsaved(() => {
                setSelectedSystem(system);
                loadGames(system.name);
                if (isMobile) goStep(1);
            });
            // A game found by the sidebar's search, in any system
            const openGame = (systemName, path) => guardUnsaved(() => {
                const target = systems.find(s => s.name === systemName);
                if (!target) return;
                setSelectedSystem(target);
                loadGames(target.name, path);
                if (isMobile) goStep(2);
            });
            const handleGameSelect = (game) => guardUnsaved(() => {
                setSelectedGame(game);
                if (isMobile) goStep(2);
            });
            // On phones each step (systems → games → details) is a browser history
            // entry, so the phone's own Back gesture steps back instead of leaving
            const mobileStepRef = useRef(0);
            mobileStepRef.current = mobileStep;
            const skipBackGuard = useRef(false);
            const goStep = (step) => {
                setMobileStep(step);
                for (let s = (window.history.state?.rmStep || 0) + 1; s <= step; s++) {
                    window.history.pushState({ rmStep: s }, '');
                }
            };
            useEffect(() => {
                const onPop = (e) => {
                    const target = e.state?.rmStep || 0;
                    if (target >= mobileStepRef.current) { setMobileStep(target); return; }
                    if (mobileStepRef.current === 2 && detailStateRef.current.dirty && !skipBackGuard.current) {
                        // Stay put until the unsaved-changes prompt is answered
                        window.history.pushState({ rmStep: 2 }, '');
                        guardUnsaved(() => { skipBackGuard.current = true; window.history.back(); });
                        return;
                    }
                    skipBackGuard.current = false;
                    setMobileStep(target);
                };
                window.addEventListener('popstate', onPop);
                return () => window.removeEventListener('popstate', onPop);
            }, []);
            const handleBack = () => {
                if ((window.history.state?.rmStep || 0) === mobileStep && mobileStep > 0) {
                    window.history.back();
                } else if (mobileStep === 2) guardUnsaved(() => setMobileStep(1));
                else if (mobileStep === 1) setMobileStep(0);
            };

            const runScan = async (systemName) => {
                const res = await fetch(`${API_BASE}/api/systems/${encodeURIComponent(systemName)}/scan`, { method: 'POST' });
                const data = await res.json();
                if (!data.success) throw new Error(data.error || 'Scan failed');
                return data.result;
            };

            const handleScanSystem = async () => {
                if (!selectedSystem) return;
                setScanning(true);
                try {
                    setScanResult(await runScan(selectedSystem.name));
                    setLastScans(prev => {
                        const next = { ...prev, [selectedSystem.name]: Date.now() };
                        try { localStorage.setItem('retromanager.lastScans', JSON.stringify(next)); } catch (e) {}
                        return next;
                    });
                } catch (err) {
                    console.error('Scan failed:', err);
                    showNotification(`Scan failed: ${err.message}`, 'error');
                } finally {
                    setScanning(false);
                }
            };

            // From Library health: go to a system and open its Scan panel
            const reviewSystem = (systemName) => {
                const target = systems.find(sys => sys.name === systemName);
                if (!target) return;
                guardUnsaved(async () => {
                    setTool(null);
                    setSelectedSystem(target);
                    loadGames(target.name);
                    if (isMobile) goStep(1);
                    setScanning(true);
                    try {
                        setScanResult(await runScan(target.name));
                    } catch (err) {
                        showNotification(`Scan failed: ${err.message}`, 'error');
                    } finally {
                        setScanning(false);
                    }
                });
            };

            // After a scan action: refresh the results, the game list and the sidebar counts
            const handleScanChanged = async () => {
                if (!selectedSystem) return;
                try {
                    setScanResult(await runScan(selectedSystem.name));
                } catch (err) {
                    showNotification(`Rescan failed: ${err.message}`, 'error');
                }
                loadGames(selectedSystem.name, selectedGame?.path);
                loadSystems();
            };

            const handleSaveGame = async (gameData) => {
                if (!selectedSystem) return;
                try {
                    // Strip ./ prefix from path for URL construction
                    const cleanPath = gameData.path.startsWith('./') ? gameData.path.slice(2) : gameData.path;
                    const url = gameData.has_metadata
                        ? `${API_BASE}/api/systems/${selectedSystem.name}/games/${encodeURIComponent(cleanPath)}`
                        : `${API_BASE}/api/systems/${selectedSystem.name}/games`;
                    const method = gameData.has_metadata ? 'PUT' : 'POST';

                    // Files picked with "+" are uploaded first (saved under the ROM's
                    // name, like scraped media), then the entry is saved with their paths
                    gameData = { ...gameData };
                    for (const [folder, value] of Object.entries(gameData)) {
                        if (!(value instanceof File)) continue;
                        const body = new FormData();
                        body.append('rom_path', cleanPath);
                        body.append('folder', folder);
                        body.append('file', value);
                        const up = await (await fetch(`${API_BASE}/api/systems/${encodeURIComponent(selectedSystem.name)}/media/upload`, { method: 'POST', body })).json();
                        if (!up.success) {
                            showNotification(`Couldn't upload ${mediaSourceLabel(folder)}: ${up.error || 'upload failed'}`, 'error');
                            return false;
                        }
                        // The XML fields that showed this folder's old file now use the new one
                        ['image', 'thumbnail', 'video'].forEach(xmlField => {
                            if (mediaFolderOf(gameData[xmlField]) === folder) gameData[xmlField] = up.path;
                        });
                        gameData[folder] = up.path;
                    }
                    gameData = autoFillXmlMedia(gameData).data;

                    const res = await fetch(url, {
                        method,
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(gameData),
                    });
                    const data = await res.json();
                    if (data.success) {
                        showNotification('Game saved successfully', 'success');
                        detailStateRef.current = { dirty: false };
                        loadSystems();
                        // Wait, so a navigation queued behind this save runs after the reload
                        await loadGames(selectedSystem.name, gameData.path);
                        return true;
                    }
                    showNotification(`Failed to save game${data.error ? `: ${data.error}` : ''}`, 'error');
                    return false;
                } catch (err) {
                    console.error('Failed to save game:', err);
                    showNotification('Failed to save game', 'error');
                    return false;
                }
            };

            const showNotification = (message, type = 'info') => {
                setNotification({ message, type });
                setTimeout(() => setNotification(null), 3000);
            };

            const onResizeStart = (column, e) => {
                if (e && e.preventDefault) e.preventDefault();
                setResizing(column);
            };

            if (loading && systems.length === 0) return (
                <div className="loading"><div className="spinner"></div></div>
            );

            const lastScan = selectedSystem ? lastScans[selectedSystem.name] : null;
            return (
                <div className="app-shell">
                <RM.Header active="library" onTool={setTool} scrapeStatus={scrapeStatus || null} />
                <LibraryBar stats={stats} system={selectedSystem} lastScan={lastScan} isMobile={isMobile}
                    onBack={isMobile && mobileStep > 0 ? handleBack : null}
                    context={isMobile && mobileStep > 0 ? (selectedSystem?.full_name || selectedSystem?.name) : null} />
                <div className="app-container" style={{
                    gridTemplateColumns: isMobile ? '1fr' : `${columnWidths.sidebar}px ${columnWidths.gameList}px 1fr`
                }}>
                    {isMobile ? (
                        mobileStep === 0 ? <Sidebar systems={systems} selectedSystem={selectedSystem} onSystemSelect={handleSystemSelect} onOpenGame={openGame} onResizeStart={onResizeStart} /> : null
                    ) : (
                        <Sidebar systems={systems} selectedSystem={selectedSystem} onSystemSelect={handleSystemSelect} onOpenGame={openGame} onResizeStart={onResizeStart} />
                    )}
                    {isMobile ? (
                        mobileStep === 1 ? (
                            <div style={{ position: 'relative', height: '100%', minHeight: 0 }}>
                                <GameList games={games} selectedGame={selectedGame} onGameSelect={handleGameSelect} onScan={handleScanSystem} onReload={reloadGamesAndSystems} scanning={scanning} loading={loading} system={selectedSystem} showNotification={showNotification} />
                            </div>
                        ) : null
                    ) : (
                        <GameList games={games} selectedGame={selectedGame} onGameSelect={handleGameSelect} onScan={handleScanSystem} onReload={reloadGamesAndSystems} scanning={scanning} loading={loading} system={selectedSystem} showNotification={showNotification} />
                    )}
                    {isMobile ? (
                        mobileStep === 2 ? (
                            <div style={{ position: 'relative', height: '100%', minHeight: 0 }}>
                                <DetailPanel game={selectedGame} system={selectedSystem} onSave={handleSaveGame} onDeleted={reloadGamesAndSystems} onResizeStart={onResizeStart} showNotification={showNotification} detailStateRef={detailStateRef} />
                            </div>
                        ) : null
                    ) : (
                        <DetailPanel game={selectedGame} system={selectedSystem} onSave={handleSaveGame} onDeleted={reloadGamesAndSystems} onResizeStart={onResizeStart} showNotification={showNotification} detailStateRef={detailStateRef} />
                    )}
                    {scanResult && selectedSystem && (
                        <ScanPanel result={scanResult} system={selectedSystem} onClose={() => setScanResult(null)} onChanged={handleScanChanged} showNotification={showNotification} />
                    )}
                    {tool === 'health' && (
                        <HealthPanel
                            onClose={() => setTool(null)}
                            onReview={reviewSystem}
                            onChanged={() => { if (selectedSystem) loadGames(selectedSystem.name, selectedGame?.path); loadSystems(); }}
                            showNotification={showNotification}
                        />
                    )}
                    {tool === 'scrape' && (
                        <LibraryScrapePanel status={scrapeStatus} refresh={refreshScrapeStatus} onClose={() => setTool(null)} onChanged={refreshLibrary} />
                    )}
                    {tool === 'media' && <MissingMediaPanel onClose={() => setTool(null)} onScrape={() => { refreshScrapeStatus(); setTool('scrape'); }} />}
                    {tool === 'history' && <PlayHistoryPanel onClose={() => setTool(null)} />}
                    {tool === 'saves' && <SavesToolPanel systems={systems} onClose={() => setTool(null)} showNotification={showNotification} />}
                    {tool === 'backups' && <BackupsPanel systems={systems} initialSystem={selectedSystem?.name} onClose={() => setTool(null)} onChanged={refreshLibrary} showNotification={showNotification} />}
                    {pendingAction && (
                        <UnsavedChangesModal
                            gameName={selectedGame?.name}
                            saving={savingPending}
                            onSave={() => resolvePending('save')}
                            onDiscard={() => resolvePending('discard')}
                            onCancel={() => resolvePending('cancel')}
                        />
                    )}
                    {notification && <Notification message={notification.message} type={notification.type} />}
                </div>
                </div>
            );
        }

        // "5 minutes ago" style text for a timestamp
        const timeAgo = (ms) => {
            const minutes = Math.round((Date.now() - ms) / 60000);
            if (minutes < 1) return 'just now';
            if (minutes < 60) return `${minutes} min ago`;
            const hours = Math.round(minutes / 60);
            if (hours < 24) return `${hours} h ago`;
            return new Date(ms).toLocaleDateString();
        };

        // The library's row under the shared header (RM.Header, common/header.js)
        function LibraryBar({ stats, system, lastScan, isMobile, onBack, context }) {
            return (
                <div className="rm-subbar library-bar">
                    {onBack && <button className="btn btn-small btn-secondary library-bar-back" onClick={onBack} aria-label="Back">‹ Back</button>}
                    {isMobile && context && <span className="library-bar-context">{context}</span>}
                    {stats && !stats.error && (
                        <span className="library-bar-stats">
                            <b>{stats.systems_with_roms}</b> systems · <b>{stats.total_games}</b> games · <b>{stats.games_missing_metadata}</b> missing metadata
                        </span>
                    )}
                    {system && (
                        <span className="library-bar-scan">
                            {system.full_name || system.name}: last scan {lastScan ? timeAgo(lastScan) : 'never (on this browser)'}
                        </span>
                    )}
                    <span className="library-bar-hint">
                        {!isMobile && <><kbd>↑</kbd> <kbd>↓</kbd> games · <kbd>/</kbd> search · <kbd>Ctrl</kbd>+<kbd>S</kbd> save</>}
                    </span>
                </div>
            );
        }

        // Who made each system, and what kind it is (for the sidebar's filters)
        const SYSTEM_MAKERS = {
            Nintendo: ['nes', 'famicom', 'fds', 'snes', 'sfc', 'n64', 'gb', 'gbc', 'gba', 'nds', '3ds', 'n3ds', 'gc', 'ngc', 'wii', 'wiiu', 'nsw', 'switch', 'nvb', 'virtualboy', 'pokemini', 'gameandwatch', 'gw'],
            Sega: ['mastersystem', 'sms', 'megadrive', 'genesis', 'gamegear', 'sega32x', 'segacd', 'saturn', 'dreamcast', 'sg-1000', 'sg1000', 'naomi'],
            Sony: ['psx', 'ps1', 'ps2', 'ps3', 'psp', 'psvita'],
            Atari: ['atari2600', 'atari5200', 'atari7800', 'atari800', 'atarilynx', 'lynx', 'atarijaguar', 'jaguar', 'atarist'],
            Computers: ['dos', 'pc', 'winxp', 'win', 'windows', 'scummvm', 'steam', 'amiga', 'c64', 'msx', 'zxspectrum', 'amstradcpc', 'x68000', 'ports'],
        };
        const HANDHELDS = ['gb', 'gbc', 'gba', 'nds', '3ds', 'n3ds', 'nvb', 'virtualboy', 'pokemini', 'gameandwatch', 'gw', 'gamegear', 'psp', 'psvita', 'atarilynx', 'lynx', 'ngp', 'ngpc', 'wonderswan', 'wonderswancolor'];
        const ARCADE = ['arcade', 'mame', 'mame-libretro', 'fba', 'fbneo', 'neogeo', 'naomi', 'cps1', 'cps2', 'cps3', 'daphne'];
        const makerOf = (name) => Object.keys(SYSTEM_MAKERS).find(m => SYSTEM_MAKERS[m].includes(name.toLowerCase())) || 'Other';
        const typeOf = (name) => {
            const n = name.toLowerCase();
            if (HANDHELDS.includes(n)) return 'Handheld';
            if (ARCADE.includes(n)) return 'Arcade';
            if (SYSTEM_MAKERS.Computers.includes(n)) return 'Computer';
            return 'Console';
        };
        const SYSTEM_SORTS = {
            name: (a, b) => (a.full_name || a.name).localeCompare(b.full_name || b.name),
            roms: (a, b) => b.rom_count - a.rom_count,
            missing: (a, b) => (b.missing_metadata_count || 0) - (a.missing_metadata_count || 0) || b.rom_count - a.rom_count,
            maker: (a, b) => makerOf(a.name).localeCompare(makerOf(b.name)) || (a.full_name || a.name).localeCompare(b.full_name || b.name),
        };

        function Sidebar({ systems, selectedSystem, onSystemSelect, onOpenGame, onResizeStart }) {
            const remembered = (key, fallback) => { try { return localStorage.getItem(key) || fallback; } catch (e) { return fallback; } };
            const [sortMode, setSortModeState] = React.useState(() => SYSTEM_SORTS[remembered('retromanager.systemSort', '')] ? remembered('retromanager.systemSort', '') : 'roms');
            const setSortMode = (m) => { setSortModeState(m); try { localStorage.setItem('retromanager.systemSort', m); } catch (e) {} };
            const [query, setQuery] = React.useState('');
            const [filtersOpen, setFiltersOpen] = React.useState(false);
            const [makers, setMakers] = React.useState([]);
            const [types, setTypes] = React.useState([]);
            const [needsWork, setNeedsWork] = React.useState(false);
            const [showEmpty, setShowEmpty] = React.useState(false);
            // Every game in the library, fetched the first time you search
            const [library, setLibrary] = React.useState(null);
            const [gameLimit, setGameLimit] = React.useState(25);

            useEffect(() => {
                if (!query.trim() || library) return;
                setLibrary('loading');
                fetch(`${API_BASE}/api/shelf`).then(r => r.json())
                    .then(d => setLibrary(d.success ? d.shelves.flatMap(s => s.games.map(g => ({ ...g, system: s.system, full_name: s.full_name }))) : []))
                    .catch(() => setLibrary([]));
            }, [query]);
            useEffect(() => { setGameLimit(25); }, [query]);

            const q = plainText(query.trim());
            const toggleIn = (setter) => (value) => setter(list => list.includes(value) ? list.filter(v => v !== value) : [...list, value]);
            const sortedSystems = React.useMemo(() => systems
                .filter(s => showEmpty || s.rom_count > 0)
                .filter(s => !needsWork || s.missing_metadata_count > 0)
                .filter(s => !makers.length || makers.includes(makerOf(s.name)))
                .filter(s => !types.length || types.includes(typeOf(s.name)))
                .filter(s => !q || plainText(s.full_name || s.name).includes(q) || plainText(s.name).includes(q))
                .sort(SYSTEM_SORTS[sortMode] || SYSTEM_SORTS.name),
            [systems, sortMode, q, makers, types, needsWork, showEmpty]);
            const gameHits = React.useMemo(() => {
                if (!q || !Array.isArray(library)) return [];
                return library.filter(g => (!makers.length || makers.includes(makerOf(g.system))) && (!types.length || types.includes(typeOf(g.system)))
                    && [g.name, g.developer, g.genre].some(v => plainText(v).includes(q)))
                    // Names starting with the search first, then names containing it, then developer/genre matches
                    .map(g => { const n = plainText(splitGameName(g.name).title); return [n.startsWith(q) ? 0 : n.includes(q) ? 1 : 2, g]; })
                    .sort((a, b) => a[0] - b[0] || (a[1].name || '').localeCompare(b[1].name || ''))
                    .map(([, g]) => g);
            }, [library, q, makers, types]);

            const filterCount = makers.length + types.length + (needsWork ? 1 : 0) + (showEmpty ? 1 : 0);
            const makerCounts = countBy(systems.filter(s => showEmpty || s.rom_count > 0), s => [makerOf(s.name)]);
            const typeCounts = countBy(systems.filter(s => showEmpty || s.rom_count > 0), s => [typeOf(s.name)]);
            let lastMaker = null;

            return (
                <div className="sidebar">
                    <div className="sidebar-header">
                        <div className="sidebar-header-title">
                            <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',gap:8,marginBottom:0}}>
                                <h2 style={{marginBottom:0}}>Systems</h2>
                                <select className="sidebar-sort" value={sortMode} onChange={e => setSortMode(e.target.value)} aria-label="Sort systems">
                                    <option value="name">Sort: Name</option>
                                    <option value="roms">Sort: Most games</option>
                                    <option value="missing">Sort: Most missing metadata</option>
                                    <option value="maker">Sort: Maker</option>
                                </select>
                            </div>
                        </div>
                        <div style={{display:'flex',gap:8,marginBottom:8}}>
                            <input type="search" className="filter-input" style={{flex:1,minWidth:0}} placeholder="Search systems and games"
                                value={query} onChange={e => setQuery(e.target.value)} aria-label="Search systems and games" />
                            <button className={`btn btn-secondary btn-small filters-button${filtersOpen ? ' open' : ''}`} aria-expanded={filtersOpen} onClick={() => setFiltersOpen(o => !o)}>
                                Filters{filterCount > 0 && <span className="filters-count">{filterCount}</span>}
                            </button>
                        </div>
                        {filtersOpen && (
                            <div className="filter-panel" style={{maxHeight:'none'}}>
                                <div className="facet">
                                    <div className="facet-title">Maker</div>
                                    <div className="facet-chips">
                                        {makerCounts.map(([m, n]) => (
                                            <button key={m} className="fchip" aria-pressed={makers.includes(m)} onClick={() => toggleIn(setMakers)(m)}>{m}<span className="n">{n}</span></button>
                                        ))}
                                    </div>
                                </div>
                                <div className="facet">
                                    <div className="facet-title">Type</div>
                                    <div className="facet-chips">
                                        {typeCounts.map(([t, n]) => (
                                            <button key={t} className="fchip" aria-pressed={types.includes(t)} onClick={() => toggleIn(setTypes)(t)}>{t}s<span className="n">{n}</span></button>
                                        ))}
                                    </div>
                                </div>
                                <div className="facet-chips">
                                    <button className="fchip" aria-pressed={needsWork} onClick={() => setNeedsWork(v => !v)}>Missing metadata</button>
                                    <button className="fchip" aria-pressed={showEmpty} onClick={() => setShowEmpty(v => !v)}>Show empty systems</button>
                                    {filterCount > 0 && <button className="link-button" onClick={() => { setMakers([]); setTypes([]); setNeedsWork(false); setShowEmpty(false); }}>Clear</button>}
                                </div>
                            </div>
                        )}
                    </div>
                    {q && sortedSystems.length > 0 && <div className="sidebar-group">Systems ({sortedSystems.length})</div>}
                    {sortedSystems.map(system => {
                        const maker = makerOf(system.name);
                        const heading = sortMode === 'maker' && maker !== lastMaker ? (lastMaker = maker) : null;
                        return (
                        <React.Fragment key={system.name}>
                        {heading && <div className="sidebar-group">{heading}</div>}
                        <div
                            className={`system-item${system.rom_count === 0 ? ' disabled' : ''}${selectedSystem?.name === system.name ? ' active' : ''}`}
                            onClick={() => onSystemSelect(system)}
                            style={{display:'flex',alignItems:'stretch',gap:0,padding:0,height:'72px',minHeight:'48px'}}
                        >
                            <div style={{width:'72px',height:'100%',flexShrink:0,display:'flex',alignItems:'stretch',justifyContent:'flex-start',background:'var(--bg-modal)',borderRadius:'4px 0 0 4px',overflow:'hidden',borderRight:'1px solid var(--border-color)'}}>
                                <span style={{flex:1,display:'flex',alignItems:'center',justifyContent:'center',padding:'4px',fontSize: system.name.length > 8 ? '9px' : system.name.length > 5 ? '11px' : '13px',fontWeight:700,letterSpacing:'0.3px',textTransform:'uppercase',color:'var(--text-secondary)',textAlign:'center',overflowWrap:'anywhere'}}>
                                    {system.name}
                                </span>
                            </div>
                            <div style={{flex:1,minWidth:0,display:'flex',flexDirection:'column',justifyContent:'center',padding:'12px'}}>
                                <div className="system-name">{system.full_name || system.name}</div>
                                <div className="system-stats">
                                    <span>ROMs: {system.rom_count}</span>
                                    {system.missing_metadata_count > 0 && (
                                        <span style={{color: 'var(--accent-pink)'}}>Missing: {system.missing_metadata_count}</span>
                                    )}
                                </div>
                            </div>
                        </div>
                        </React.Fragment>
                        );
                    })}
                    {!q && sortedSystems.length === 0 && systems.length > 0 && <div style={{color: 'var(--text-secondary)', fontSize: '13px', padding: '4px 0 8px'}}>No systems match.</div>}
                    {systems.length === 0 && <div style={{color: 'var(--text-secondary)', fontSize: '14px'}}>No systems found</div>}
                    {q && (
                        <>
                            <div className="sidebar-group">Games in every system {Array.isArray(library) ? `(${gameHits.length})` : ''}</div>
                            {library === 'loading' && <div style={{color:'var(--text-secondary)',fontSize:13}}>Searching...</div>}
                            {Array.isArray(library) && gameHits.length === 0 && <div style={{color:'var(--text-secondary)',fontSize:13}}>No games match.</div>}
                            {gameHits.slice(0, gameLimit).map(g => (
                                <button key={`${g.system}|${g.path}`} className="search-hit" onClick={() => onOpenGame(g.system, g.path)}>
                                    <span className="search-hit-art">
                                        {g.box2d ? <img src={`${API_BASE}/api/thumb/160/${g.box2d.split('/').map(encodeURIComponent).join('/')}`} alt="" loading="lazy" /> : '🎮'}
                                    </span>
                                    <span style={{minWidth:0,flex:1}}>
                                        <span className="search-hit-name">{splitGameName(g.name).title}</span>
                                        <span className="search-hit-meta">{[g.full_name, g.year].filter(Boolean).join(' · ')}</span>
                                    </span>
                                </button>
                            ))}
                            {gameHits.length > gameLimit && (
                                <button className="link-button" style={{margin:'6px 0'}} onClick={() => setGameLimit(l => l + 50)}>Show {Math.min(50, gameHits.length - gameLimit)} more</button>
                            )}
                        </>
                    )}
                </div>
            );
        }

        // "Super Mario World (USA) (Rev 1)" -> title "Super Mario World", tags "(USA) (Rev 1)"
        const splitGameName = (name) => {
            const full = (name || '').trim();
            const tags = full.match(/[\(\[][^\)\]]*[\)\]]/g) || [];
            const title = full.replace(/\s*[\(\[][^\)\]]*[\)\]]/g, '').replace(/\s+/g, ' ').trim();
            return { title: title || full, tags: title ? tags.join(' ') : '' };
        };

        const byTitle = (a, b) => splitGameName(a.name).title.localeCompare(splitGameName(b.name).title, undefined, { sensitivity: 'base', numeric: true });
        const GAME_SORTS = {
            name: byTitle,
            // Undated / unrated games go last
            date: (a, b) => (a.releasedate || '99999999').localeCompare(b.releasedate || '99999999') || byTitle(a, b),
            newest: (a, b) => (b.releasedate || '').localeCompare(a.releasedate || '') || byTitle(a, b),
            rating: (a, b) => (b.rating ?? -1) - (a.rating ?? -1) || byTitle(a, b),
            developer: (a, b) => (a.developer || '￿').localeCompare(b.developer || '￿') || byTitle(a, b),
            series: (a, b) => (a._series || '￿').localeCompare(b._series || '￿') || (a.releasedate || '9').localeCompare(b.releasedate || '9'),
            file: (a, b) => (a.path || '').localeCompare(b.path || '', undefined, { sensitivity: 'base', numeric: true }),
        };
        const SORT_LABELS = { name: 'Name', date: 'Oldest first', newest: 'Newest first', rating: 'Rating', developer: 'Developer', series: 'Series', file: 'File name' };

        // ------------------------------------------------------------------
        // Game filters: facets worked out from the games themselves
        // ------------------------------------------------------------------
        const plainText = (t) => (t || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();

        // "Star Wars: Rogue Leader" -> "Star Wars"; "Castlevania II: …" -> "Castlevania";
        // "Pokémon Snap" joins Pokémon. A series needs two games. (Same rules as the Timeline.)
        function assignSeries(games) {
            const labels = {};
            const prefix = (name) => {
                const i = name.indexOf(': ');
                return i < 1 ? null : name.slice(0, i).replace(/\s+(\d+|[IVX]+)$/, '').trim() || null;
            };
            const key = {};
            games.forEach(g => {
                const p = prefix(splitGameName(g.name).title);
                if (!p) return;
                const k = plainText(p);
                (labels[k] = labels[k] || {})[p] = (labels[k][p] || 0) + 1;
                key[g.path] = k;
            });
            const keys = Object.keys(labels).sort((a, b) => b.length - a.length);
            games.forEach(g => {
                if (key[g.path]) return;
                const t = plainText(splitGameName(g.name).title);
                const k = keys.find(k => t === k || t.startsWith(k + ' '));
                if (k) key[g.path] = k;
            });
            const counts = {};
            Object.values(key).forEach(k => { counts[k] = (counts[k] || 0) + 1; });
            const result = {};
            games.forEach(g => {
                const k = key[g.path];
                result[g.path] = k && counts[k] >= 2 ? Object.entries(labels[k]).sort((a, b) => b[1] - a[1])[0][0] : null;
            });
            return result;
        }

        // Main genre of each listed one: "Platform / Run & Jump, Action" -> Platform, Action.
        // Older scrapes use hyphens: "Driving-Racing TPV" -> Driving
        const genresOf = (g) => [...new Set((g.genre || '').split(',').map(s => s.split(' / ')[0].split(/-(?=[A-Z])/)[0].trim()).filter(Boolean))];
        const yearOf = (g) => /^\d{4}/.test(g.releasedate || '') ? Number(g.releasedate.slice(0, 4)) : null;
        const maxPlayers = (g) => { const n = String(g.players || '').match(/\d+/g); return n ? Math.max(...n.map(Number)) : null; };
        const REGION_TAGS = [
            ['USA', /^(usa|us|u|ntsc-u)$/i], ['Europe', /^(europe|eu|e|pal|uk|australia)$/i],
            ['Japan', /^(japan|jp|j|ntsc-j)$/i], ['World', /^(world|w|ue|ju|uj)$/i],
        ];
        // Regions from the file name's tags: "(USA, Europe)" -> USA, Europe
        const regionsOf = (g) => {
            const file = (g.path || '').split('/').pop();
            const found = new Set();
            (file.match(/\(([^)]*)\)/g) || []).forEach(tag => tag.slice(1, -1).split(',').forEach(part => {
                const hit = REGION_TAGS.find(([, re]) => re.test(part.trim()));
                if (hit) found.add(hit[0]);
            }));
            return found.size ? [...found] : ['No region tag'];
        };
        const FILTER_MEDIA = [
            ['box2d', 'Box 2D'], ['box3d', 'Box 3D'], ['boxside', 'Spine'], ['screenshot', 'Screenshot'],
            ['screenshottitle', 'Title screen'], ['wheel', 'Wheel'], ['fanart', 'Fanart'], ['videos', 'Video'], ['manuals', 'Manual'],
        ];
        const STATUS_FACETS = [
            ['missing', 'Missing metadata', g => !g.has_metadata],
            ['rom-missing', 'ROM missing', g => !g.rom_exists],
            ['no-image', 'No image in gamelist', g => g.has_metadata && !g.image],
            ['no-desc', 'No description', g => !g.desc],
            ['favorite', 'Favourites', g => !!g.favorite],
        ];
        const PLAYER_FACETS = [['1', 'One player'], ['2', '2+'], ['3', '3+'], ['4', '4+']];
        const RATING_FACETS = [['0', 'Any'], ['0.4', '2★+'], ['0.6', '3★+'], ['0.8', '4★+']];
        const EMPTY_FILTERS = { status: [], series: [], genre: [], decade: [], region: [], missing: [], players: '', rating: '0', developer: '', publisher: '' };
        // Filters that only make sense within one system, cleared when you switch
        const SYSTEM_SPECIFIC_FILTERS = ['series', 'genre', 'developer', 'publisher'];

        function gameMatches(g, f) {
            const any = (list, test) => !list.length || list.some(test);
            return any(f.status, k => STATUS_FACETS.find(s => s[0] === k)[2](g))
                && any(f.series, s => g._series === s)
                && any(f.genre, s => genresOf(g).includes(s))
                && any(f.decade, d => { const y = yearOf(g); return d === 'unknown' ? y === null : y !== null && Math.floor(y / 10) * 10 === Number(d); })
                && any(f.region, r => regionsOf(g).includes(r))
                && any(f.missing, m => !g[m])
                && (!f.players || (f.players === '1' ? maxPlayers(g) === 1 : (maxPlayers(g) || 0) >= Number(f.players)))
                && (f.rating === '0' || (g.rating ?? -1) >= Number(f.rating))
                && (!f.developer || (g.developer || '') === f.developer)
                && (!f.publisher || (g.publisher || '') === f.publisher);
        }

        const countBy = (games, valuesOf) => {
            const counts = {};
            games.forEach(g => valuesOf(g).forEach(v => { if (v !== null && v !== undefined && v !== '') counts[v] = (counts[v] || 0) + 1; }));
            return Object.entries(counts).sort((a, b) => b[1] - a[1] || String(a[0]).localeCompare(String(b[0])));
        };

        // The filter panel under the game list's search box
        function GameFilterPanel({ games, filters, setFilters }) {
            const [more, setMore] = React.useState({});
            const toggle = (facet, value) => setFilters(f => ({ ...f, [facet]: f[facet].includes(value) ? f[facet].filter(v => v !== value) : [...f[facet], value] }));
            const set = (facet, value) => setFilters(f => ({ ...f, [facet]: value }));
            const chips = (facet, entries, limit = 12) => {
                const shown = more[facet] ? entries : entries.slice(0, limit);
                const picked = entries.filter(([v]) => filters[facet].includes(String(v)) && !shown.some(([s]) => s === v));
                return (
                    <div className="facet-chips">
                        {[...shown, ...picked].map(([value, count, label]) => (
                            <button key={value} className="fchip" aria-pressed={filters[facet].includes(String(value))} onClick={() => toggle(facet, String(value))}>
                                {label || value}<span className="n">{count}</span>
                            </button>
                        ))}
                        {entries.length > limit && (
                            <button className="fchip more" onClick={() => setMore(m => ({ ...m, [facet]: !m[facet] }))}>
                                {more[facet] ? 'Fewer' : `+${entries.length - limit} more`}
                            </button>
                        )}
                    </div>
                );
            };
            const series = countBy(games, g => [g._series]);
            const genres = countBy(games, genresOf);
            const decades = countBy(games, g => { const y = yearOf(g); return [y === null ? 'unknown' : Math.floor(y / 10) * 10]; })
                .sort((a, b) => a[0] === 'unknown' ? 1 : b[0] === 'unknown' ? -1 : Number(a[0]) - Number(b[0]))
                .map(([d, n]) => [d, n, d === 'unknown' ? 'No date' : `${d}s`]);
            const regions = countBy(games, regionsOf);
            const developers = countBy(games, g => [g.developer]);
            const publishers = countBy(games, g => [g.publisher]);
            const facet = (title, body) => body && (
                <div className="facet"><div className="facet-title">{title}</div>{body}</div>
            );
            return (
                <div className="filter-panel">
                    {facet('Show only', chips('status', STATUS_FACETS.map(([k, label, test]) => [k, games.filter(test).length, label]).filter(e => e[1]), 99))}
                    {series.length > 0 && facet('Series', chips('series', series))}
                    {genres.length > 0 && facet('Genre', chips('genre', genres))}
                    {facet('Decade', chips('decade', decades, 99))}
                    {facet('Region', chips('region', regions, 99))}
                    {facet('Missing media', chips('missing', FILTER_MEDIA.map(([k, label]) => [k, games.filter(g => !g[k]).length, label]).filter(e => e[1]), 99))}
                    <div className="facet-row">
                        <div className="facet">
                            <div className="facet-title">Players</div>
                            <div className="facet-chips">
                                <button className="fchip" aria-pressed={!filters.players} onClick={() => set('players', '')}>Any</button>
                                {PLAYER_FACETS.map(([v, label]) => (
                                    <button key={v} className="fchip" aria-pressed={filters.players === v} onClick={() => set('players', filters.players === v ? '' : v)}>{label}</button>
                                ))}
                            </div>
                        </div>
                        <div className="facet">
                            <div className="facet-title">Rating</div>
                            <div className="facet-chips">
                                {RATING_FACETS.map(([v, label]) => (
                                    <button key={v} className="fchip" aria-pressed={filters.rating === v} onClick={() => set('rating', v)}>{label}</button>
                                ))}
                            </div>
                        </div>
                    </div>
                    <div className="facet-row">
                        {developers.length > 0 && (
                            <label className="facet">
                                <span className="facet-title">Developer</span>
                                <select value={filters.developer} onChange={e => set('developer', e.target.value)}>
                                    <option value="">Any</option>
                                    {developers.map(([d, n]) => <option key={d} value={d}>{d} ({n})</option>)}
                                </select>
                            </label>
                        )}
                        {publishers.length > 0 && (
                            <label className="facet">
                                <span className="facet-title">Publisher</span>
                                <select value={filters.publisher} onChange={e => set('publisher', e.target.value)}>
                                    <option value="">Any</option>
                                    {publishers.map(([d, n]) => <option key={d} value={d}>{d} ({n})</option>)}
                                </select>
                            </label>
                        )}
                    </div>
                </div>
            );
        }

        // Chips for the filters in use, each removable
        function activeFilterChips(filters, setFilters) {
            const out = [];
            const drop = (facet, value) => setFilters(f => ({ ...f, [facet]: Array.isArray(f[facet]) ? f[facet].filter(v => v !== value) : EMPTY_FILTERS[facet] }));
            filters.status.forEach(v => out.push([`status:${v}`, STATUS_FACETS.find(s => s[0] === v)[1], () => drop('status', v)]));
            filters.series.forEach(v => out.push([`series:${v}`, `Series: ${v}`, () => drop('series', v)]));
            filters.genre.forEach(v => out.push([`genre:${v}`, v, () => drop('genre', v)]));
            filters.decade.forEach(v => out.push([`decade:${v}`, v === 'unknown' ? 'No date' : `${v}s`, () => drop('decade', v)]));
            filters.region.forEach(v => out.push([`region:${v}`, v, () => drop('region', v)]));
            filters.missing.forEach(v => out.push([`missing:${v}`, `No ${FILTER_MEDIA.find(m => m[0] === v)[1].toLowerCase()}`, () => drop('missing', v)]));
            if (filters.players) out.push(['players', `${PLAYER_FACETS.find(p => p[0] === filters.players)[1]} players`.replace('One player players', 'One player'), () => drop('players')]);
            if (filters.rating !== '0') out.push(['rating', RATING_FACETS.find(r => r[0] === filters.rating)[1], () => drop('rating')]);
            if (filters.developer) out.push(['developer', `Dev: ${filters.developer}`, () => drop('developer')]);
            if (filters.publisher) out.push(['publisher', `Pub: ${filters.publisher}`, () => drop('publisher')]);
            return out;
        }

        const isTypingTarget = (el) => el && (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA' || el.tagName === 'SELECT' || el.isContentEditable);

        // Media bulk scraping can download (videos are left out: large and slow)
        const BULK_MEDIA = [
            { key: 'box2d', label: 'Box 2D' },
            { key: 'screenshot', label: 'Screenshot' },
            { key: 'screenshottitle', label: 'Title screen' },
            { key: 'wheel', label: 'Wheel' },
            { key: 'mix', label: 'Mix' },
            { key: 'box3d', label: 'Box 3D' },
            { key: 'boxside', label: 'Spine' },
            { key: 'fanart', label: 'Fanart' },
            { key: 'manuals', label: 'Manual' },
        ];

        const BULK_PRESETS = [
            { key: 'missing', label: 'Missing metadata', test: g => !g.has_metadata },
            { key: 'no-desc', label: 'No description', test: g => !g.desc },
            { key: 'no-image', label: 'No image in gamelist', test: g => !g.image },
            { key: 'all', label: 'All games', test: () => true },
        ];

        const CONFIDENCE = {
            exact: { label: 'Exact', color: 'var(--success)', help: 'ScreenScraper recognised this exact ROM file' },
            likely: { label: 'Likely', color: 'var(--accent-orange)', help: "The game's name closely matches the ROM" },
            unsure: { label: 'Unsure', color: 'var(--accent-pink)', help: 'The names differ: check before applying' },
            none: { label: 'No match', color: 'var(--text-secondary)', help: 'Nothing found. Try searching another name' },
        };

        const postJson = async (url, body) => {
            const res = await fetch(`${API_BASE}${url}`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
            return res.json();
        };

        // Match many games to ScreenScraper, review the matches, then fill their blanks
        function BulkScrapePanel({ system, games, onClose, onDone }) {
            const [stage, setStage] = React.useState('select'); // select | matching | review | applying | done
            const [preset, setPreset] = React.useState(() => games.some(g => !g.has_metadata) ? 'missing' : 'no-desc');
            const [picked, setPicked] = React.useState({});
            const [media, setMedia] = React.useState(() => Object.fromEntries(BULK_MEDIA.map(m => [m.key, true])));
            const [matches, setMatches] = React.useState({}); // rom path -> {confidence, alternatives, chosen, error}
            const [ticked, setTicked] = React.useState({});
            const [progress, setProgress] = React.useState(null);
            const [message, setMessage] = React.useState(null);
            const [results, setResults] = React.useState({}); // rom path -> apply result
            const [reviewFilter, setReviewFilter] = React.useState('all');
            const [searchText, setSearchText] = React.useState({});
            const [searching, setSearching] = React.useState({});
            const cancelRef = React.useRef(false);

            const presetGames = React.useMemo(() => {
                const p = BULK_PRESETS.find(x => x.key === preset) || BULK_PRESETS[0];
                return games.filter(p.test);
            }, [games, preset]);
            useEffect(() => {
                setPicked(Object.fromEntries(presetGames.map(g => [g.path, true])));
            }, [presetGames]);

            const selectedGames = presetGames.filter(g => picked[g.path]);
            const gameByPath = React.useMemo(() => Object.fromEntries(games.map(g => [g.path, g])), [games]);
            const title = (path) => splitGameName(gameByPath[path]?.name || path).title;

            const findMatches = async () => {
                cancelRef.current = false;
                setMessage(null);
                setStage('matching');
                const found = {};
                const autoTick = {};
                for (let i = 0; i < selectedGames.length; i++) {
                    if (cancelRef.current) break;
                    const g = selectedGames[i];
                    setProgress({ done: i, total: selectedGames.length, current: title(g.path) });
                    try {
                        const d = await postJson('/api/bulk-scrape/match', { system_name: system.name, rom_path: g.path });
                        if (!d.success) {
                            found[g.path] = { confidence: 'none', alternatives: [], error: d.error };
                            if (d.fatal) {
                                setMessage({ type: 'error', text: `Stopped: ${d.error}` });
                                break;
                            }
                        } else {
                            found[g.path] = { confidence: d.confidence, alternatives: d.alternatives, chosen: d.match_id };
                            autoTick[g.path] = d.confidence === 'exact' || d.confidence === 'likely';
                        }
                    } catch (err) {
                        found[g.path] = { confidence: 'none', alternatives: [], error: err.message };
                    }
                    setMatches({ ...found });
                }
                setTicked(autoTick);
                setProgress(null);
                setStage('review');
            };

            const researchOne = async (path) => {
                const query = (searchText[path] || '').trim();
                if (!query) return;
                setSearching(prev => ({ ...prev, [path]: true }));
                try {
                    const d = await postJson('/api/bulk-scrape/match', { system_name: system.name, rom_path: path, query });
                    if (d.success) {
                        setMatches(prev => ({ ...prev, [path]: { confidence: d.confidence, alternatives: d.alternatives, chosen: d.match_id } }));
                        // You searched for it yourself, so the top result is ticked
                        setTicked(prev => ({ ...prev, [path]: !!d.match_id }));
                    } else {
                        setMatches(prev => ({ ...prev, [path]: { ...prev[path], error: d.error } }));
                    }
                } finally {
                    setSearching(prev => ({ ...prev, [path]: false }));
                }
            };

            const applyAll = async () => {
                const paths = Object.keys(matches).filter(p => ticked[p] && matches[p].chosen);
                if (!paths.length) return;
                cancelRef.current = false;
                setMessage(null);
                setStage('applying');
                // One backup of the gamelist before anything is written
                try { await postJson('/api/backup_gamelist', { system: system.name }); } catch (e) {}
                const mediaList = Object.keys(media).filter(k => media[k]);
                const done = {};
                for (let i = 0; i < paths.length; i++) {
                    if (cancelRef.current) break;
                    const path = paths[i];
                    setProgress({ done: i, total: paths.length, current: title(path) });
                    try {
                        const d = await postJson('/api/bulk-scrape/apply', { system_name: system.name, rom_path: path, game_id: matches[path].chosen, media: mediaList });
                        done[path] = d;
                        if (!d.success && d.fatal) {
                            setMessage({ type: 'error', text: `Stopped: ${d.error}` });
                            setResults({ ...done });
                            break;
                        }
                    } catch (err) {
                        done[path] = { success: false, error: err.message };
                    }
                    setResults({ ...done });
                }
                setProgress(null);
                setStage('done');
                onDone();
            };

            const progressBar = progress && (
                <div style={{marginBottom: 16}}>
                    <div style={{fontSize: 13, color: 'var(--text-secondary)', marginBottom: 6}}>
                        {stage === 'matching' ? 'Finding' : 'Applying'} {progress.done + 1} of {progress.total}: <b style={{color: 'var(--text-primary)'}}>{progress.current}</b>
                    </div>
                    <div style={{height: 6, background: 'var(--border-color)', borderRadius: 3, overflow: 'hidden'}}>
                        <div style={{height: '100%', width: `${(progress.done / progress.total) * 100}%`, background: 'var(--accent-orange)', transition: 'width 0.3s'}} />
                    </div>
                    <button className="btn btn-secondary btn-small" style={{marginTop: 10}} onClick={() => { cancelRef.current = true; }}>
                        Stop after this game
                    </button>
                </div>
            );

            const badge = (confidence) => {
                const c = CONFIDENCE[confidence] || CONFIDENCE.none;
                return <span title={c.help} style={{fontSize: 11, padding: '1px 6px', borderRadius: 3, border: `1px solid ${c.color}`, color: c.color, whiteSpace: 'nowrap'}}>{c.label}</span>;
            };

            const counts = Object.values(matches).reduce((acc, m) => ({ ...acc, [m.confidence]: (acc[m.confidence] || 0) + 1 }), {});
            const tickedCount = Object.keys(matches).filter(p => ticked[p] && matches[p].chosen).length;
            const reviewPaths = Object.keys(matches).filter(p =>
                reviewFilter === 'all' || (reviewFilter === 'attention' ? ['unsure', 'none'].includes(matches[p].confidence) : ticked[p]));

            let body;
            if (stage === 'select') {
                body = (
                    <>
                        <div style={{display: 'flex', gap: 8, flexWrap: 'wrap', marginBottom: 12}}>
                            {BULK_PRESETS.map(p => (
                                <button key={p.key} className={`btn btn-small ${preset === p.key ? 'btn-primary' : 'btn-secondary'}`} onClick={() => setPreset(p.key)}>
                                    {p.label} ({games.filter(p.test).length})
                                </button>
                            ))}
                        </div>
                        <div style={{maxHeight: 280, overflowY: 'auto', display: 'flex', flexDirection: 'column', gap: 4, marginBottom: 16}}>
                            {presetGames.length === 0 && <div style={{color: 'var(--text-secondary)', fontSize: 13}}>No games in this group.</div>}
                            {presetGames.map(g => {
                                const n = splitGameName(g.name);
                                return (
                                    <label key={g.path} style={{display: 'flex', gap: 10, alignItems: 'center', padding: '6px 8px', background: 'var(--bg-tertiary)', borderRadius: 4, fontSize: 13, cursor: 'pointer'}}>
                                        <input type="checkbox" checked={!!picked[g.path]} onChange={() => setPicked(prev => ({ ...prev, [g.path]: !prev[g.path] }))} />
                                        <span style={{flex: 1}}>{n.title} <span style={{color: 'var(--text-secondary)', fontSize: 11}}>{n.tags}</span></span>
                                        {!g.has_metadata && <span className="status-badge status-missing">No entry</span>}
                                    </label>
                                );
                            })}
                        </div>
                        <div style={{fontSize: 13, fontWeight: 600, marginBottom: 6}}>Media to download (only where the game has none yet)</div>
                        <div style={{display: 'flex', gap: 12, flexWrap: 'wrap', marginBottom: 16, fontSize: 13}}>
                            {BULK_MEDIA.map(m => (
                                <label key={m.key} style={{display: 'flex', gap: 6, alignItems: 'center', cursor: 'pointer'}}>
                                    <input type="checkbox" checked={!!media[m.key]} onChange={() => setMedia(prev => ({ ...prev, [m.key]: !prev[m.key] }))} />
                                    {m.label}
                                </label>
                            ))}
                        </div>
                        <div style={{display: 'flex', justifyContent: 'space-between', alignItems: 'center', gap: 12, flexWrap: 'wrap'}}>
                            <span style={{fontSize: 12, color: 'var(--text-secondary)'}}>Nothing is written until you review the matches and click Apply.</span>
                            <button className="btn btn-primary" disabled={!selectedGames.length} onClick={findMatches}>Find matches ({selectedGames.length})</button>
                        </div>
                    </>
                );
            } else if (stage === 'matching') {
                body = (
                    <>
                        {progressBar}
                        <div style={{fontSize: 13, color: 'var(--text-secondary)'}}>
                            {Object.keys(CONFIDENCE).map(k => counts[k] ? `${counts[k]} ${CONFIDENCE[k].label.toLowerCase()}` : null).filter(Boolean).join(' · ') || 'Starting...'}
                        </div>
                    </>
                );
            } else if (stage === 'review') {
                body = (
                    <>
                        <div style={{display: 'flex', gap: 8, flexWrap: 'wrap', alignItems: 'center', marginBottom: 12, fontSize: 13}}>
                            {Object.keys(CONFIDENCE).map(k => counts[k] ? <span key={k}>{badge(k)} {counts[k]}</span> : null)}
                            <select value={reviewFilter} onChange={e => setReviewFilter(e.target.value)} style={{marginLeft: 'auto', padding: 6, borderRadius: 4, border: '1px solid var(--border-color)', background: 'var(--bg-tertiary)', color: 'var(--text-primary)'}}>
                                <option value="all">Show all</option>
                                <option value="attention">Needs attention</option>
                                <option value="ticked">Ticked only</option>
                            </select>
                        </div>
                        <div style={{maxHeight: '52vh', overflowY: 'auto', display: 'flex', flexDirection: 'column', gap: 6, marginBottom: 16}}>
                            {reviewPaths.map(path => {
                                const m = matches[path];
                                const chosen = m.alternatives.find(a => String(a.id) === String(m.chosen));
                                return (
                                    <div key={path} style={{display: 'flex', gap: 10, alignItems: 'flex-start', padding: 8, background: 'var(--bg-tertiary)', borderRadius: 4, fontSize: 13}}>
                                        <input type="checkbox" style={{marginTop: 4}} disabled={!m.chosen} checked={!!ticked[path] && !!m.chosen}
                                            onChange={() => setTicked(prev => ({ ...prev, [path]: !prev[path] }))} />
                                        <div style={{width: 48, height: 48, flexShrink: 0, borderRadius: 3, overflow: 'hidden', background: 'var(--bg-secondary)'}}>
                                            {chosen?.image && <img src={chosen.image} alt="" loading="lazy" style={{width: '100%', height: '100%', objectFit: 'contain'}} />}
                                        </div>
                                        <div style={{flex: 1, minWidth: 0}}>
                                            <div style={{display: 'flex', gap: 8, alignItems: 'center', flexWrap: 'wrap'}}>
                                                <b>{title(path)}</b> {badge(m.confidence)}
                                            </div>
                                            <div style={{color: 'var(--text-secondary)', fontSize: 11, marginBottom: 4, wordBreak: 'break-word'}}>{path}</div>
                                            {m.alternatives.length > 0 && (
                                                <select value={m.chosen || ''} onChange={e => setMatches(prev => ({ ...prev, [path]: { ...prev[path], chosen: e.target.value } }))}
                                                    style={{width: '100%', padding: 6, borderRadius: 4, border: '1px solid var(--border-color)', background: 'var(--bg-secondary)', color: 'var(--text-primary)', fontSize: 12}}>
                                                    {m.alternatives.map(a => (
                                                        <option key={a.id} value={a.id}>
                                                            {a.nom}{a.year ? ` · ${a.year}` : ''} · {a.systemenom}{a.is_hack ? ' · hack' : ''} ({Math.round(a.score * 100)}%)
                                                        </option>
                                                    ))}
                                                </select>
                                            )}
                                            {m.error && <div style={{color: 'var(--accent-pink)', fontSize: 12, marginTop: 4}}>{m.error}</div>}
                                            {['unsure', 'none'].includes(m.confidence) && (
                                                <div style={{display: 'flex', gap: 6, marginTop: 6}}>
                                                    <input type="text" placeholder="Search another name..." value={searchText[path] || ''}
                                                        onChange={e => setSearchText(prev => ({ ...prev, [path]: e.target.value }))}
                                                        onKeyDown={e => { if (e.key === 'Enter') researchOne(path); }}
                                                        style={{flex: 1, padding: 6, borderRadius: 4, border: '1px solid var(--border-color)', background: 'var(--bg-secondary)', color: 'var(--text-primary)', fontSize: 12}} />
                                                    <button className="btn btn-secondary btn-small" disabled={searching[path]} onClick={() => researchOne(path)}>{searching[path] ? '...' : 'Search'}</button>
                                                </div>
                                            )}
                                        </div>
                                    </div>
                                );
                            })}
                        </div>
                        <div style={{display: 'flex', justifyContent: 'space-between', alignItems: 'center', gap: 12, flexWrap: 'wrap'}}>
                            <span style={{fontSize: 12, color: 'var(--text-secondary)'}}>Fills only empty fields and downloads only missing media. The gamelist is backed up first.</span>
                            <button className="btn btn-primary" disabled={!tickedCount} onClick={applyAll}>Apply {tickedCount} game{tickedCount === 1 ? '' : 's'}</button>
                        </div>
                    </>
                );
            } else {
                const entries = Object.entries(results);
                const ok = entries.filter(([, r]) => r.success);
                const totalMedia = ok.reduce((n, [, r]) => n + (r.downloaded || []).length, 0);
                body = (
                    <>
                        {progressBar}
                        {stage === 'done' && (
                            <div style={{fontSize: 14, marginBottom: 12}}>
                                Updated <b>{ok.length}</b> game{ok.length === 1 ? '' : 's'} and downloaded <b>{totalMedia}</b> media file{totalMedia === 1 ? '' : 's'}.
                                {entries.length - ok.length > 0 && <span style={{color: 'var(--accent-pink)'}}> {entries.length - ok.length} failed.</span>}
                            </div>
                        )}
                        <div style={{maxHeight: '52vh', overflowY: 'auto', display: 'flex', flexDirection: 'column', gap: 4}}>
                            {entries.map(([path, r]) => (
                                <div key={path} style={{padding: '6px 8px', background: 'var(--bg-tertiary)', borderRadius: 4, fontSize: 13}}>
                                    <b>{title(path)}</b>{' '}
                                    {r.success ? (
                                        <span style={{color: 'var(--text-secondary)'}}>
                                            {r.filled.length ? `filled ${r.filled.join(', ')}` : 'nothing to fill'}
                                            {r.downloaded.length ? ` · downloaded ${r.downloaded.join(', ')}` : ''}
                                        </span>
                                    ) : <span style={{color: 'var(--accent-pink)'}}>{r.error}</span>}
                                    {r.errors && r.errors.length > 0 && <div style={{color: 'var(--accent-pink)', fontSize: 12}}>{r.errors.join(' · ')}</div>}
                                </div>
                            ))}
                        </div>
                    </>
                );
            }

            const busy = stage === 'matching' || stage === 'applying';
            return (
                <Modal open={true} onClose={busy ? () => {} : onClose}>
                    <h2 style={{marginBottom: 4}}>Bulk scrape: {system.full_name || system.name}</h2>
                    <div style={{color: 'var(--text-secondary)', fontSize: 13, marginBottom: 16}}>
                        {stage === 'select' && 'Choose games. Each is looked up on ScreenScraper by its ROM file name, then by title.'}
                        {(stage === 'matching' || stage === 'review') && 'Exact and Likely matches are ticked. Check the Unsure ones, pick another result, or search a different name.'}
                        {(stage === 'applying' || stage === 'done') && 'Filling empty fields and downloading missing media.'}
                    </div>
                    {message && (
                        <div role="alert" style={{marginBottom: 12, padding: '10px 12px', borderRadius: 4, fontSize: 13, background: 'rgba(255,107,157,0.12)', border: '1px solid var(--accent-pink)'}}>{message.text}</div>
                    )}
                    {body}
                </Modal>
            );
        }

        function GameList({ games, selectedGame, onGameSelect, onScan, onReload, scanning, loading, system }) {
                        // ...existing code...
                        // Accept showNotification as a prop
                        const showNotification = typeof arguments[0].showNotification === 'function' ? arguments[0].showNotification : null;
            // All hooks and helper functions at the top!
            const [settingsOpen, setSettingsOpen] = React.useState(false);
            const [gameFilter, setGameFilter] = React.useState('');
            const [filters, setFilters] = React.useState(EMPTY_FILTERS);
            const [filtersOpen, setFiltersOpen] = React.useState(false);
            const [bulkOpen, setBulkOpen] = React.useState(false);
            // Sort is remembered in this browser
            const [sortKey, setSortKeyState] = React.useState(() => {
                try { return GAME_SORTS[localStorage.getItem('retromanager.gameSort')] ? localStorage.getItem('retromanager.gameSort') : 'name'; } catch (e) { return 'name'; }
            });
            const setSortKey = (k) => { setSortKeyState(k); try { localStorage.setItem('retromanager.gameSort', k); } catch (e) {} };
            const filterInputRef = React.useRef(null);
            const listRef = React.useRef(null);
            const [backups, setBackups] = React.useState([]);
            const [loadingBackups, setLoadingBackups] = React.useState(false);
            const [restoring, setRestoring] = React.useState(false);
            const [selectedBackup, setSelectedBackup] = React.useState(null);

            // Each game's series, worked out once per list
            const seriesGames = React.useMemo(() => {
                const series = assignSeries(games);
                return games.map(g => ({ ...g, _series: series[g.path] }));
            }, [games]);

            // Search text (accents ignored), filters and sort
            const filteredGames = React.useMemo(() => {
                const query = plainText(gameFilter.trim());
                const matchesText = (game) => !query ||
                    ['name', 'path', 'desc', 'genre', 'developer', 'publisher', '_series'].some(f => plainText(game[f]).includes(query));
                const list = seriesGames.filter(g => gameMatches(g, filters) && matchesText(g)).sort(GAME_SORTS[sortKey] || GAME_SORTS.name);
                // Back to the original objects, so selection still matches
                const byPath = Object.fromEntries(games.map(g => [g.path, g]));
                return list.map(g => Object.assign(byPath[g.path], { _series: g._series }));
            }, [games, seriesGames, gameFilter, filters, sortKey]);
            const activeChips = activeFilterChips(filters, setFilters);

            // Keyboard: up/down moves through the list, "/" jumps to search, Esc leaves it
            useEffect(() => {
                const onKey = (e) => {
                    if (e.ctrlKey || e.metaKey || e.altKey) return;
                    if (e.key === '/' && !isTypingTarget(document.activeElement)) {
                        e.preventDefault();
                        filterInputRef.current && filterInputRef.current.focus();
                        return;
                    }
                    if (e.key === 'Escape' && document.activeElement === filterInputRef.current) {
                        filterInputRef.current.blur();
                        return;
                    }
                    if ((e.key === 'ArrowDown' || e.key === 'ArrowUp') &&
                        (!isTypingTarget(document.activeElement) || document.activeElement === filterInputRef.current)) {
                        if (!filteredGames.length) return;
                        e.preventDefault();
                        const current = filteredGames.findIndex(g => g.path === selectedGame?.path);
                        const next = current === -1 ? 0
                            : Math.min(Math.max(current + (e.key === 'ArrowDown' ? 1 : -1), 0), filteredGames.length - 1);
                        if (next !== current) onGameSelect(filteredGames[next]);
                    }
                };
                window.addEventListener('keydown', onKey);
                return () => window.removeEventListener('keydown', onKey);
            }, [filteredGames, selectedGame, onGameSelect]);

            // A new system starts with an empty search, and drops the filters that
            // only apply to one system (series, genre, developer, publisher)
            useEffect(() => {
                setGameFilter('');
                setFilters(f => ({ ...f, ...Object.fromEntries(SYSTEM_SPECIFIC_FILTERS.map(k => [k, EMPTY_FILTERS[k]])) }));
            }, [system?.name]);

            // Keep the selected game visible when moving with the keyboard
            useEffect(() => {
                if (!selectedGame || !listRef.current) return;
                const el = listRef.current.querySelector(`[data-path="${CSS.escape(selectedGame.path)}"]`);
                if (el) el.scrollIntoView({ block: 'nearest' });
            }, [selectedGame]);

            const fetchBackups = async () => {
                if (!system) return;
                setLoadingBackups(true);
                try {
                    const res = await fetch(`${API_BASE}/api/list_gamelist_backups`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ system: system.name })
                    });
                    const data = await res.json();
                    if (data.success) setBackups(data.backups);
                    else setBackups([]);
                } catch {
                    setBackups([]);
                } finally {
                    setLoadingBackups(false);
                }
            };

            React.useEffect(() => {
                if (settingsOpen) fetchBackups();
            }, [settingsOpen, system]);

            const mediaURL = (mediaPath) => {
                if (!mediaPath) return null;
                // If it's already a full URL (external), return as-is
                if (typeof mediaPath === 'string' && (mediaPath.startsWith('http://') || mediaPath.startsWith('https://'))) {
                    return mediaPath;
                }
                const encoded = mediaPath.split('/').map(part => encodeURIComponent(part)).join('/');
                return `${API_BASE}/api/media/${encoded}`;
            };
            const handleBackupGamelist = async () => {
                if (!system) return;
                try {
                    const res = await fetch(`${API_BASE}/api/backup_gamelist`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ system: system.name })
                    });
                    const data = await res.json();
                    if (data.success) {
                        if (typeof showNotification === 'function') showNotification(`Backup created: ${data.backup}`, 'success');
                        fetchBackups();
                    } else {
                        if (typeof showNotification === 'function') showNotification(data.error || 'Backup failed', 'error');
                    }
                } catch (err) {
                    if (typeof showNotification === 'function') showNotification('Backup failed', 'error');
                }
            };

            const handleRestoreBackup = async () => {
                if (!system || !selectedBackup) return;
                setRestoring(true);
                try {
                    const res = await fetch(`${API_BASE}/api/restore_gamelist_backup`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ system: system.name, backup: selectedBackup })
                    });
                    const data = await res.json();
                    if (data.success) {
                        if (showNotification) showNotification('Gamelist restored from backup', 'success');
                    } else {
                        if (showNotification) showNotification(data.error || 'Restore failed', 'error');
                    }
                } catch (err) {
                    if (showNotification) showNotification('Restore failed', 'error');
                } finally {
                    setRestoring(false);
                }
            };
            // Helper to get the correct image/thumbnail for a game
            const getGameImage = (game) => {
                const type = game.image_type || 'box2d';
                return game[type] || null;
            };
            // Card background: the in-game screenshot, or the title screen if there's none
            const getGameBackground = (game) => {
                const path = game.screenshot || game.screenshottitle;
                return typeof path === 'string' ? path : null;
            };
            const getGameThumbnail = (game) => {
                const type = game.thumbnail_type || 'wheel';
                return game[type] || null;
            };
            return (
                <div className="game-list" ref={listRef}>
                    <div className="game-list-header">
                        <div className="game-list-header-title">
                            <h2>Games ({games.length})</h2>
                            <div className="game-list-actions" style={{display:'flex',gap:8,alignItems:'center'}}>
                                <button className="btn btn-secondary btn-small" onClick={onScan} disabled={scanning || !system}>{scanning ? 'Scanning...' : 'Scan'}</button>
                                <button className="btn btn-secondary btn-small" onClick={() => setBulkOpen(true)} disabled={!system || !games.length} title="Scrape many games at once">Bulk scrape</button>
                                <a className="btn btn-primary btn-small" href={`/import${system ? `?system=${encodeURIComponent(system.name)}` : ''}`} style={{textDecoration:'none'}} title="Upload games, or add them from the inbox folder">Add</a>
                                <button className="btn btn-icon-blue btn-small" title="Settings" style={{marginLeft:4}} onClick={()=>setSettingsOpen(true)} disabled={!system}>
                                    <svg width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
                                        <path d="M10 13.5A3.5 3.5 0 1 0 10 6.5a3.5 3.5 0 0 0 0 7z" stroke="#fff" strokeWidth="1.5"/>
                                        <path d="M17.5 10a7.5 7.5 0 0 0-.13-1.38l1.6-1.25a.5.5 0 0 0 .12-.65l-1.5-2.6a.5.5 0 0 0-.61-.23l-1.88.76a7.5 7.5 0 0 0-1.19-.7l-.28-2A.5.5 0 0 0 12.5 1h-3a.5.5 0 0 0-.5.42l-.28 2a7.5 7.5 0 0 0-1.19.7l-1.88-.76a.5.5 0 0 0-.61.23l-1.5 2.6a.5.5 0 0 0 .12.65l1.6 1.25A7.5 7.5 0 0 0 2.5 10c0 .47.04.93.13 1.38l-1.6 1.25a.5.5 0 0 0-.12.65l1.5 2.6a.5.5 0 0 0 .61.23l1.88-.76c.37.27.77.51 1.19.7l.28 2A.5.5 0 0 0 7.5 19h3a.5.5 0 0 0 .5-.42l.28-2c.42-.19.82-.43 1.19-.7l1.88.76a.5.5 0 0 0 .61-.23l1.5-2.6a.5.5 0 0 0-.12-.65l-1.6-1.25c.09-.45.13-.91.13-1.38z" stroke="#fff" strokeWidth="1.5"/>
                                    </svg>
                                </button>
                            </div>
                        </div>
                        {system && (
                            <>
                                <div className="game-list-toolbar">
                                    <input
                                        ref={filterInputRef}
                                        type="search"
                                        className="filter-input"
                                        placeholder="Search games  ( / )"
                                        value={gameFilter}
                                        onChange={e => setGameFilter(e.target.value)}
                                    />
                                    <button className={`btn btn-secondary btn-small filters-button${filtersOpen ? ' open' : ''}`} aria-expanded={filtersOpen}
                                        onClick={() => setFiltersOpen(o => !o)} title="Filter by status, series, genre, decade, region...">
                                        Filters{activeChips.length > 0 && <span className="filters-count">{activeChips.length}</span>}
                                    </button>
                                    <select value={sortKey} onChange={e => setSortKey(e.target.value)} title="Sort by">
                                        {Object.entries(SORT_LABELS).map(([k, label]) => <option key={k} value={k}>Sort: {label}</option>)}
                                    </select>
                                </div>
                                {filtersOpen && <GameFilterPanel games={seriesGames} filters={filters} setFilters={setFilters} />}
                                {activeChips.length > 0 && (
