                                <button className="btn btn-primary btn-small" style={{marginLeft: 'auto'}}
                                    onClick={() => startScrape(filter === 'any' ? [...scrapeable] : [filter])}>
                                    Scrape {filter === 'any' ? 'missing media' : mediaSourceLabel(filter)} for these
                                </button>
                            )}
                        </div>
                        {!detail ? <div style={{color: 'var(--text-secondary)'}}>Loading...</div> : games.length === 0 ? (
                            <div style={{color: 'var(--text-secondary)', padding: '20px 0'}}>Every game has it.</div>
                        ) : (
                            <div style={{display: 'grid', gridTemplateColumns: 'repeat(auto-fill, minmax(130px, 1fr))', gap: 10, maxHeight: '60vh', overflowY: 'auto'}}>
                                {games.map(g => {
                                    const art = g.media.box2d || g.media.screenshot || g.media.wheel;
                                    const lacking = folders.filter(f => !g.media[f]);
                                    return (
                                        <a key={g.path} href={gameLink(system, g.path)} title={`Missing: ${lacking.map(mediaSourceLabel).join(', ')}`}
                                            style={{textDecoration: 'none', color: 'inherit', background: 'var(--bg-tertiary)', borderRadius: 6, overflow: 'hidden', display: 'flex', flexDirection: 'column'}}>
                                            <div style={{aspectRatio: '3 / 4', background: 'var(--bg-secondary)', display: 'flex', alignItems: 'center', justifyContent: 'center'}}>
                                                {art ? <img src={thumbUrl(320, art)} alt="" loading="lazy" style={{width: '100%', height: '100%', objectFit: 'contain'}} />
                                                     : <span style={{fontSize: 28, opacity: 0.4}}>🎮</span>}
                                            </div>
                                            <div style={{padding: '6px 8px', fontSize: 12}}>
                                                <div style={{fontWeight: 600, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap'}}>{g.name}</div>
                                                <div style={{color: 'var(--text-secondary)', fontSize: 11, marginTop: 2}}>{lacking.length} missing</div>
                                            </div>
                                        </a>
                                    );
                                })}
                            </div>
                        )}
                    </>
                );
            }

            return (
                <Modal open={true} onClose={onClose}>
                    <h2 style={{marginBottom: 4}}>Missing media</h2>
                    <div style={{color: 'var(--text-secondary)', fontSize: 13, marginBottom: 16}}>Media found by file name in each system's media folders.</div>
                    {body}
                </Modal>
            );
        }

        const saveShotUrl = (root, rel) => `${API_BASE}/api/save-screenshot/${root}/${rel.split('/').map(encodeURIComponent).join('/')}`;
        // "sync-conflict-20240101-120000-ABCDEFG" -> the device id Syncthing appended
        const conflictDevice = (path) => (path.match(/sync-conflict-\d{8}-\d{6}-([A-Z0-9]+)/) || [])[1];

        // Syncthing conflicts and zipped save backups
        function SavesToolPanel({ systems, onClose, showNotification }) {
            const [conflicts, setConflicts] = React.useState(null);
            const [writable, setWritable] = React.useState(true);
            const [backups, setBackups] = React.useState(null);
            const [scope, setScope] = React.useState('');
            const [includeStates, setIncludeStates] = React.useState(true);
            const [busy, setBusy] = React.useState(null);
            const [error, setError] = React.useState(null);

            const loadConflicts = () => fetch(`${API_BASE}/api/save-conflicts`).then(r => r.json())
                .then(d => { if (d.success) { setConflicts(d.conflicts); setWritable(d.writable); } else setError(d.error); })
                .catch(e => setError(e.message));
            const loadBackups = () => fetch(`${API_BASE}/api/save-backups`).then(r => r.json())
                .then(d => { if (d.success) setBackups(d); return d; }).catch(e => setError(e.message));
            useEffect(() => { loadConflicts(); loadBackups(); }, []);
            // Poll while a backup is being zipped
            useEffect(() => {
                if (!backups?.job?.running) return;
                const t = setTimeout(loadBackups, 1500);
                return () => clearTimeout(t);
            }, [backups]);

            const keep = async (group, version) => {
                setBusy(group.id);
                const d = await postJson('/api/save-conflicts/resolve', { id: group.id, keep: version.path });
                setBusy(null);
                if (d.success) {
                    showNotification(`Kept ${version.path === group.path ? 'the original' : 'that version'}; ${d.moved.length} file${d.moved.length === 1 ? '' : 's'} moved to save-backups/${d.backup}.`, 'success');
                    loadConflicts();
                } else showNotification(d.error || 'Could not resolve', 'error');
            };
            const startBackup = async () => {
                const d = await postJson('/api/save-backups', { system: scope || null, include_states: includeStates });
                if (!d.success) showNotification(d.error || 'Could not start the backup', 'error');
                loadBackups();
            };
            const removeBackup = async (name) => {
                if (!window.confirm(`Delete ${name}? This can't be undone.`)) return;
                const d = await (await fetch(`${API_BASE}/api/save-backups/${encodeURIComponent(name)}`, { method: 'DELETE' })).json();
                if (!d.success) showNotification(d.error || 'Could not delete', 'error');
                loadBackups();
            };

            const job = backups?.job;
            const section = (title, children) => (
                <div style={{marginBottom: 20, background: 'var(--bg-secondary)', border: '1px solid var(--border-color)', borderRadius: 6, padding: 14}}>
                    <h3 style={{fontSize: 15, margin: '0 0 8px'}}>{title}</h3>
                    {children}
                </div>
            );

            return (
                <Modal open={true} onClose={onClose}>
                    <h2 style={{marginBottom: 16}}>Saves</h2>
                    {error && <div style={{color: 'var(--accent-pink)', marginBottom: 12}}>{error}</div>}

                    {section(<>Sync conflicts {conflicts && <span style={{color: 'var(--accent-orange)'}}>({conflicts.length})</span>}</>, (
                        <>
                            <div style={{color: 'var(--text-secondary)', fontSize: 12, marginBottom: 10, lineHeight: 1.4}}>
                                Syncthing keeps both versions when a save changes on two devices at once. Pick the one to keep:
                                it gets the normal name so the emulator loads it, and the others move to <code>save-backups/conflicts/</code>.
                            </div>
                            {!writable && <div style={{color: 'var(--accent-pink)', fontSize: 13, marginBottom: 10}}>The saves folders are mounted read-only, so conflicts can't be resolved. Remove <code>:ro</code> from them in docker-compose.yml.</div>}
                            {!conflicts ? <div style={{color: 'var(--text-secondary)'}}>Looking...</div> : conflicts.length === 0 ? (
                                <div style={{color: 'var(--text-secondary)', fontSize: 13}}>No conflicts.</div>
                            ) : conflicts.map(group => (
                                <div key={group.id} style={{marginBottom: 12}}>
                                    <div style={{fontWeight: 600, fontSize: 14}}>
                                        {group.game?.name || group.base}
                                        <span style={{color: 'var(--text-secondary)', fontWeight: 400, fontSize: 12, marginLeft: 8}}>
                                            {[group.game?.full_name || group.folder, group.profile !== 'shared' ? capitalize(group.profile) : null, group.path].filter(Boolean).join(' · ')}
                                        </span>
                                    </div>
                                    <div style={{display: 'flex', flexDirection: 'column', gap: 4, marginTop: 6}}>
                                        {group.versions.map((v, i) => (
                                            <div key={v.path} style={{display: 'flex', gap: 10, alignItems: 'center', padding: '6px 8px', background: 'var(--bg-tertiary)', borderRadius: 4, fontSize: 13}}>
                                                {v.screenshot && <img src={saveShotUrl(v.root, v.screenshot)} alt="" style={{width: 56, height: 42, objectFit: 'cover', borderRadius: 3}} />}
                                                <div style={{flex: 1, minWidth: 0}}>
                                                    <div>
                                                        {v.path === group.path ? 'Current file' : `Copy from device ${conflictDevice(v.path) || '?'}`}
                                                        {i === 0 && <span style={{color: 'var(--success)', fontSize: 11, marginLeft: 8}}>newest</span>}
                                                    </div>
                                                    <div style={{color: 'var(--text-secondary)', fontSize: 12}}>
                                                        {new Date(v.modified).toLocaleString()} · {formatBytes(v.size)}
                                                    </div>
                                                </div>
                                                <button className="btn btn-secondary btn-small" disabled={!writable || busy === group.id} onClick={() => keep(group, v)}>Keep this</button>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            ))}
                        </>
                    ))}

                    {section('Backups', (
                        <>
                            <div style={{color: 'var(--text-secondary)', fontSize: 12, marginBottom: 10}}>
                                Zips every person's saves (and, if ticked, save states) into <code>save-backups/zips/</code> on the NAS.
                                One game's saves can be downloaded from its Saves section.
                            </div>
                            {backups && !backups.folder_ok && <div style={{color: 'var(--accent-pink)', fontSize: 13, marginBottom: 10}}>The save-backups folder isn't mounted or isn't writable (see docker-compose.yml).</div>}
                            <div style={{display: 'flex', gap: 8, alignItems: 'center', flexWrap: 'wrap', marginBottom: 12}}>
                                <select value={scope} onChange={e => setScope(e.target.value)}>
                                    <option value="">Everything</option>
                                    {systems.filter(s => s.rom_count).map(s => <option key={s.name} value={s.name}>{s.full_name || s.name}</option>)}
                                </select>
                                <label style={{display: 'flex', gap: 6, alignItems: 'center', fontSize: 13}}>
                                    <input type="checkbox" checked={includeStates} onChange={e => setIncludeStates(e.target.checked)} /> Include save states
                                </label>
                                <button className="btn btn-primary btn-small" disabled={job?.running || (backups && !backups.folder_ok)} onClick={startBackup}>
                                    {job?.running ? `Zipping ${job.done}/${job.total || '…'}` : 'Create backup'}
                                </button>
                            </div>
                            {job?.error && <div style={{color: 'var(--accent-pink)', fontSize: 13, marginBottom: 8}}>Last backup failed: {job.error}</div>}
                            {(backups?.backups || []).map(b => (
                                <div key={b.name} style={{display: 'flex', gap: 10, alignItems: 'center', padding: '6px 8px', background: 'var(--bg-tertiary)', borderRadius: 4, fontSize: 13, marginBottom: 4}}>
                                    <div style={{flex: 1, minWidth: 0}}>
                                        <div style={{overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap'}}>{b.name}</div>
                                        <div style={{color: 'var(--text-secondary)', fontSize: 12}}>{new Date(b.modified).toLocaleString()} · {formatBytes(b.size)}</div>
                                    </div>
                                    <a className="btn btn-secondary btn-small" href={`${API_BASE}/api/save-backups/${encodeURIComponent(b.name)}`} style={{textDecoration: 'none'}}>Download</a>
                                    <button className="btn btn-secondary btn-small" onClick={() => removeBackup(b.name)} aria-label={`Delete ${b.name}`}>Delete</button>
                                </div>
                            ))}
                        </>
                    ))}
                </Modal>
            );
        }

        // What's been played, by whom, from save and save-state times
        function PlayHistoryPanel({ onClose }) {
            const [data, setData] = React.useState(null);
            const [error, setError] = React.useState(null);
            const [person, setPerson] = React.useState('all');
            const [limit, setLimit] = React.useState(30);
            useEffect(() => {
                fetch(`${API_BASE}/api/play-history`).then(r => r.json())
                    .then(d => d.success ? setData(d) : setError(d.error)).catch(e => setError(e.message));
            }, []);

            const lastFor = (g) => person === 'all' ? g.last : (g.profiles[person] || 0);
            const games = (data?.games || []).filter(g => lastFor(g) > 0).sort((a, b) => lastFor(b) - lastFor(a));
            const mostPlayed = (data?.games || []).filter(g => g.playcount > 0).sort((a, b) => b.playcount - a.playcount).slice(0, 10);
            const monthAgo = Date.now() / 1000 - 30 * 86400;
            const bySystem = {};
            games.forEach(g => {
                const s = bySystem[g.full_name] || (bySystem[g.full_name] = { ever: 0, month: 0 });
                s.ever++;
                if (lastFor(g) >= monthAgo) s.month++;
            });
            const people = data ? ['all', ...data.people, 'shared'] : [];
            const personLabel = (p) => p === 'all' ? 'Everyone' : p === 'shared' ? 'Shared saves' : capitalize(p);

            const row = (g, extra) => (
                <a key={`${g.system}/${g.rom_path}`} href={gameLink(g.system, g.rom_path)}
                    style={{display: 'flex', gap: 10, alignItems: 'center', padding: '6px 8px', background: 'var(--bg-tertiary)', borderRadius: 4, fontSize: 13, textDecoration: 'none', color: 'inherit'}}>
                    <div style={{width: 36, height: 48, flexShrink: 0, borderRadius: 3, overflow: 'hidden', background: 'var(--bg-secondary)', display: 'flex', alignItems: 'center', justifyContent: 'center'}}>
                        {g.box2d ? <img src={thumbUrl(160, g.box2d)} alt="" loading="lazy" style={{width: '100%', height: '100%', objectFit: 'cover'}} /> : <span style={{opacity: 0.4}}>🎮</span>}
                    </div>
                    <div style={{flex: 1, minWidth: 0}}>
                        <div style={{fontWeight: 600, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap'}}>{g.name}</div>
                        <div style={{color: 'var(--text-secondary)', fontSize: 12}}>{g.full_name}</div>
                    </div>
                    <div style={{textAlign: 'right', fontSize: 12, flexShrink: 0}}>{extra}</div>
                </a>
            );

            return (
                <Modal open={true} onClose={onClose}>
                    <h2 style={{marginBottom: 4}}>Play history</h2>
                    <div style={{color: 'var(--text-secondary)', fontSize: 13, marginBottom: 14, maxWidth: 640}}>
                        When each game's saves and save states were last written, and by whom.
                        {data && !data.games.some(g => g.playcount) && ' EmulationStation isn’t recording play counts in the gamelists, so saves are the only record.'}
                    </div>
                    {error && <div style={{color: 'var(--accent-pink)'}}>{error}</div>}
                    {!data && !error && <div style={{color: 'var(--text-secondary)'}}>Reading saves...</div>}
                    {data && (
                        <>
                            <div role="tablist" style={{display: 'flex', gap: 6, flexWrap: 'wrap', marginBottom: 14}}>
                                {people.map(p => (
                                    <button key={p} role="tab" aria-selected={person === p} className={`btn btn-small ${person === p ? 'btn-primary' : 'btn-secondary'}`}
                                        onClick={() => { setPerson(p); setLimit(30); }}>{personLabel(p)}</button>
                                ))}
                            </div>
                            <div style={{display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(280px, 1fr))', gap: 20}}>
                                <div>
                                    <h3 style={{fontSize: 14, marginBottom: 8}}>Recently played <span style={{color: 'var(--text-secondary)', fontWeight: 400}}>({games.length})</span></h3>
                                    <div style={{display: 'flex', flexDirection: 'column', gap: 4}}>
                                        {games.length === 0 && <div style={{color: 'var(--text-secondary)', fontSize: 13}}>No saves yet.</div>}
                                        {games.slice(0, limit).map(g => row(g, (
                                            <>
                                                <div title={new Date(lastFor(g) * 1000).toLocaleString()}>{timeAgo(lastFor(g) * 1000)}</div>
                                                {person === 'all' && g.last_by && <div style={{color: 'var(--text-secondary)'}}>{personLabel(g.last_by)}</div>}
                                            </>
                                        )))}
                                        {games.length > limit && (
                                            <button className="btn btn-secondary btn-small" style={{alignSelf: 'flex-start'}} onClick={() => setLimit(l => l + 50)}>Show more</button>
                                        )}
                                    </div>
                                </div>
                                <div>
                                    <h3 style={{fontSize: 14, marginBottom: 8}}>By system</h3>
                                    <table style={{width: '100%', borderCollapse: 'collapse', fontSize: 13, marginBottom: 20}}>
                                        <thead>
                                            <tr style={{color: 'var(--text-secondary)', borderBottom: '1px solid var(--border-color)'}}>
                                                <th style={{textAlign: 'left', padding: '6px 4px', fontWeight: 500}}>System</th>
                                                <th style={{padding: '6px 4px', fontWeight: 500}}>Last 30 days</th>
                                                <th style={{padding: '6px 4px', fontWeight: 500}}>Ever</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            {Object.entries(bySystem).sort((a, b) => b[1].month - a[1].month || b[1].ever - a[1].ever).map(([name, s]) => (
                                                <tr key={name} style={{borderBottom: '1px solid var(--border-color)'}}>
                                                    <td style={{padding: '6px 4px'}}>{name}</td>
                                                    <td style={{padding: '6px 4px', textAlign: 'center'}}>{s.month || '·'}</td>
                                                    <td style={{padding: '6px 4px', textAlign: 'center'}}>{s.ever}</td>
                                                </tr>
                                            ))}
                                        </tbody>
                                    </table>
                                    {mostPlayed.length > 0 && (
                                        <>
                                            <h3 style={{fontSize: 14, marginBottom: 8}}>Most played (EmulationStation count)</h3>
                                            <div style={{display: 'flex', flexDirection: 'column', gap: 4}}>
                                                {mostPlayed.map(g => row(g, <div>{g.playcount}×</div>))}
                                            </div>
                                        </>
                                    )}
                                    {data.unmatched > 0 && (
                                        <div style={{color: 'var(--text-secondary)', fontSize: 12}}>{data.unmatched} save files didn't match a game in the library.</div>
                                    )}
                                </div>
                            </div>
                        </>
                    )}
                </Modal>
            );
        }

        // Every saved copy of a system's gamelist: what restoring it would change
        function BackupsPanel({ systems, initialSystem, onClose, onChanged, showNotification }) {
            const [system, setSystem] = React.useState(initialSystem || systems.find(s => s.rom_count)?.name || '');
            const [list, setList] = React.useState(null);
            const [picked, setPicked] = React.useState(null);
            const [diff, setDiff] = React.useState(null);
            const [busy, setBusy] = React.useState(false);
            const [expanded, setExpanded] = React.useState({});
            const base = `${API_BASE}/api/systems/${encodeURIComponent(system)}/gamelist-backups`;

            const load = () => {
                setList(null);
                return fetch(base).then(r => r.json()).then(d => setList(d.success ? d : { backups: [], error: d.error }));
            };
            useEffect(() => { if (system) { setPicked(null); load(); } }, [system]);
            useEffect(() => {
                setDiff(null);
                setExpanded({});
                if (!picked) return;
                fetch(`${base}/${encodeURIComponent(picked)}/diff`).then(r => r.json()).then(setDiff);
            }, [picked]);

            const restore = async () => {
                if (!window.confirm(`Replace ${system}'s gamelist.xml with ${picked}? The current one is backed up first.`)) return;
                setBusy(true);
                const d = await postJson(`/api/systems/${encodeURIComponent(system)}/gamelist-backups/${encodeURIComponent(picked)}/restore`, {});
                setBusy(false);
                if (d.success) {
                    showNotification(`Restored ${picked}. The previous gamelist is saved as ${d.backup}.`, 'success');
                    setPicked(null);
                    load();
                    onChanged && onChanged();
                } else showNotification(d.error || 'Restore failed', 'error');
            };
            const remove = async (name) => {
                if (!window.confirm(`Delete ${name}? This can't be undone.`)) return;
                const d = await (await fetch(`${base}/${encodeURIComponent(name)}`, { method: 'DELETE' })).json();
                if (d.success) { if (picked === name) setPicked(null); load(); } else showNotification(d.error || 'Delete failed', 'error');
            };
            const dated = (list?.backups || []).filter(b => b.kind === 'Backup');
            const prune = async () => {
                if (!window.confirm(`Delete ${dated.length - 10} older dated backups, keeping the newest 10?`)) return;
                const d = await postJson(`/api/systems/${encodeURIComponent(system)}/gamelist-backups/prune`, { keep: 10 });
                if (d.success) { showNotification(`Deleted ${d.removed.length} old backups`, 'success'); load(); }
            };

            const clip = (text, key) => {
                if (!text) return <i style={{color: 'var(--text-secondary)'}}>empty</i>;
                if (text.length <= 140 || expanded[key]) return text;
                return <>{text.slice(0, 140)}… <button onClick={() => setExpanded(e => ({ ...e, [key]: true }))} style={{background: 'none', border: 'none', color: 'var(--accent-blue)', cursor: 'pointer', padding: 0}}>more</button></>;
            };
            const group = (title, items, render, color) => items.length > 0 && (
                <div style={{marginBottom: 14}}>
                    <h4 style={{fontSize: 13, margin: '0 0 6px', color}}>{title} ({items.length})</h4>
                    <div style={{display: 'flex', flexDirection: 'column', gap: 4}}>{items.map(render)}</div>
                </div>
            );

            return (
                <Modal open={true} onClose={onClose}>
                    <h2 style={{marginBottom: 4}}>Gamelist backups</h2>
                    <div style={{color: 'var(--text-secondary)', fontSize: 13, marginBottom: 14}}>
                        Every fix makes a dated copy of gamelist.xml first. Pick one to see what restoring it would change.
                    </div>
                    <div style={{display: 'flex', gap: 8, alignItems: 'center', flexWrap: 'wrap', marginBottom: 12}}>
                        <select value={system} onChange={e => setSystem(e.target.value)}>
                            {systems.filter(s => s.rom_count).map(s => <option key={s.name} value={s.name}>{s.full_name || s.name}</option>)}
                        </select>
                        {list && <span style={{fontSize: 13, color: 'var(--text-secondary)'}}>{list.backups.length} copies · current gamelist has {list.current_entries} entries</span>}
                        {dated.length > 10 && <button className="btn btn-secondary btn-small" style={{marginLeft: 'auto'}} onClick={prune}>Keep newest 10 backups</button>}
                    </div>
                    <div style={{display: 'grid', gridTemplateColumns: 'minmax(220px, 1fr) minmax(0, 2fr)', gap: 16}} className="backups-grid">
                        <div style={{display: 'flex', flexDirection: 'column', gap: 4, maxHeight: '60vh', overflowY: 'auto'}}>
                            {!list && <div style={{color: 'var(--text-secondary)'}}>Loading...</div>}
                            {list && list.backups.length === 0 && <div style={{color: 'var(--text-secondary)', fontSize: 13}}>No copies for this system.</div>}
                            {(list?.backups || []).map(b => (
                                <button key={b.name} onClick={() => setPicked(b.name)}
                                    style={{textAlign: 'left', padding: '8px 10px', borderRadius: 4, cursor: 'pointer', fontSize: 13, color: 'var(--text-primary)',
                                            background: picked === b.name ? 'var(--bg-secondary)' : 'var(--bg-tertiary)',
                                            border: `1px solid ${picked === b.name ? 'var(--accent-pink)' : 'transparent'}`}}>
                                    <div>{new Date(b.modified).toLocaleString()}</div>
                                    <div style={{color: 'var(--text-secondary)', fontSize: 11}}>
                                        {b.kind} · {b.entries ?? '?'} entries{b.kind !== 'Backup' ? ` · ${b.name}` : ''}
                                    </div>
                                </button>
                            ))}
                        </div>
                        <div style={{minWidth: 0, maxHeight: '60vh', overflowY: 'auto'}}>
                            {!picked ? <div style={{color: 'var(--text-secondary)', fontSize: 13}}>Pick a copy on the left.</div> : !diff ? (
                                <div style={{color: 'var(--text-secondary)'}}>Comparing...</div>
                            ) : !diff.success ? <div style={{color: 'var(--accent-pink)'}}>{diff.error}</div> : (
                                <>
                                    <div style={{display: 'flex', gap: 8, alignItems: 'center', flexWrap: 'wrap', marginBottom: 12}}>
                                        <span style={{fontSize: 13, flex: 1}}>
                                            {diff.added.length + diff.removed.length + diff.changed.length === 0
                                                ? 'Identical to the current gamelist.'
                                                : 'Restoring this copy would:'}
                                        </span>
                                        <button className="btn btn-primary btn-small" disabled={busy} onClick={restore}>Restore this copy</button>
                                        <button className="btn btn-secondary btn-small" onClick={() => remove(picked)}>Delete</button>
                                    </div>
                                    {group('Bring back entries', diff.added, e => (
                                        <div key={e.path} style={{padding: '4px 8px', background: 'var(--bg-tertiary)', borderRadius: 4, fontSize: 13}}>{e.name || e.path}</div>
                                    ), 'var(--success)')}
                                    {group('Remove entries', diff.removed, e => (
                                        <div key={e.path} style={{padding: '4px 8px', background: 'var(--bg-tertiary)', borderRadius: 4, fontSize: 13}}>{e.name || e.path}</div>
                                    ), 'var(--accent-pink)')}
                                    {group('Change entries', diff.changed, c => (
                                        <div key={c.path} style={{padding: '6px 8px', background: 'var(--bg-tertiary)', borderRadius: 4, fontSize: 13}}>
                                            <div style={{fontWeight: 600, marginBottom: 4}}>{c.name || c.path}</div>
                                            {c.fields.map(f => (
                                                <div key={f.field} style={{display: 'grid', gridTemplateColumns: '90px 1fr', gap: 8, fontSize: 12, marginBottom: 2}}>
                                                    <span style={{color: 'var(--text-secondary)'}}>{f.field}</span>
                                                    <span style={{wordBreak: 'break-word'}}>
                                                        <span style={{textDecoration: 'line-through', color: 'var(--text-secondary)'}}>{clip(f.now, `${c.path}:${f.field}:now`)}</span>
                                                        {' → '}{clip(f.then, `${c.path}:${f.field}:then`)}
                                                    </span>
                                                </div>
                                            ))}
                                        </div>
                                    ), 'var(--accent-orange)')}
                                </>
                            )}
                        </div>
                    </div>
                </Modal>
            );
        }

        function HealthPanel({ onClose, onReview, onChanged, showNotification }) {
            const [data, setData] = React.useState(null);
            const [error, setError] = React.useState(null);
            const [fixing, setFixing] = React.useState(null); // progress text while fixing

            const load = async () => {
                setError(null);
                try {
                    const res = await fetch(`${API_BASE}/api/library-scan`);
                    const d = await res.json();
                    if (d.success) setData(d.systems); else setError(d.error || 'Scan failed');
                } catch (err) {
                    setError(err.message);
                }
            };
            useEffect(() => { load(); }, []);

            const issueCount = (s) => HEALTH_COLUMNS.reduce((n, c) => n + (s.counts[c.key] || 0), 0);
            const withIssues = (data || []).filter(s => issueCount(s) > 0 || s.error);
            const clean = (data || []).filter(s => issueCount(s) === 0 && !s.error);
            const totals = Object.fromEntries(HEALTH_COLUMNS.map(c => [c.key, (data || []).reduce((n, s) => n + (s.counts[c.key] || 0), 0)]));
            const safeTotal = totals.truncated_names + totals.media_links + totals.disc_tracks;

            // Only the fixes that can't lose anything: linking existing media and
            // folding disc track entries into their disc. Each makes a gamelist backup.
            const fixSafeEverywhere = async () => {
                const jobs = [];
                (data || []).forEach(s => {
                    if (s.counts.truncated_names) jobs.push({ system: s, url: 'names/fix', label: 'fixing names' });
                    if (s.counts.disc_tracks) jobs.push({ system: s, url: 'disc-tracks/merge', label: 'merging disc tracks' });
                    if (s.counts.media_links) jobs.push({ system: s, url: 'link-media', label: 'linking media' });
                });
                let changed = 0, failed = 0;
                for (let i = 0; i < jobs.length; i++) {
                    const job = jobs[i];
                    setFixing(`${i + 1} of ${jobs.length}: ${job.system.full_name || job.system.system}, ${job.label}`);
                    try {
                        const res = await fetch(`${API_BASE}/api/systems/${encodeURIComponent(job.system.system)}/${job.url}`, {
                            method: 'POST', headers: { 'Content-Type': 'application/json' }, body: '{}',
                        });
                        const d = await res.json();
                        if (d.success) changed += d.changed || 0; else failed++;
                    } catch (err) {
                        failed++;
                    }
                }
                setFixing(null);
                showNotification(`Fixed ${changed} item${changed === 1 ? '' : 's'}${failed ? `, ${failed} failed` : ''}. Gamelists were backed up first.`, failed ? 'error' : 'success');
                onChanged();
                load();
            };

            const cell = (n, col) => (
                <td key={col.key} style={{textAlign: 'center', padding: '8px 6px', color: n ? (col.safe ? 'var(--accent-orange)' : 'var(--text-primary)') : 'var(--text-secondary)', fontWeight: n ? 600 : 400}}>
                    {n || '·'}
                </td>
            );

            return (
                <Modal open={true} onClose={fixing ? null : onClose}>
                    <h2 style={{marginBottom: 4}}>Library health</h2>
                    <div style={{color: 'var(--text-secondary)', fontSize: 13, marginBottom: 16}}>
                        Every system's Scan in one place. <b style={{color: 'var(--accent-orange)'}}>Orange</b> issues are safe to fix everywhere at once; the others are best reviewed per system.
                    </div>
                    {error && <div style={{color: 'var(--accent-pink)', marginBottom: 12}}>{error}</div>}
                    {!data && !error && <div style={{color: 'var(--text-secondary)'}}>Scanning every system...</div>}
                    {data && (
                        <>
                            <div style={{display: 'flex', gap: 12, alignItems: 'center', flexWrap: 'wrap', marginBottom: 12}}>
                                <button className="btn btn-primary" disabled={!safeTotal || !!fixing} onClick={fixSafeEverywhere}>
                                    {fixing ? 'Fixing...' : `Fix safe issues everywhere (${safeTotal})`}
                                </button>
                                <span style={{fontSize: 12, color: 'var(--text-secondary)'}}>
                                    {fixing || `Fixes ${totals.truncated_names} cut-off names, links ${totals.media_links} unlinked media and merges ${totals.disc_tracks} disc track entries. Files aren't touched.`}
                                </span>
                            </div>
                            {withIssues.length === 0 ? (
                                <div style={{padding: '20px 0', color: 'var(--text-secondary)'}}>Nothing to fix in any system.</div>
                            ) : (
                                <div style={{overflowX: 'auto'}}>
                                    <table style={{width: '100%', borderCollapse: 'collapse', fontSize: 13}}>
                                        <thead>
                                            <tr style={{borderBottom: '1px solid var(--border-color)', color: 'var(--text-secondary)'}}>
                                                <th style={{textAlign: 'left', padding: '8px 6px'}}>System</th>
                                                {HEALTH_COLUMNS.map(c => <th key={c.key} title={c.help} style={{padding: '8px 6px', fontWeight: 500}}>{c.label}</th>)}
                                                <th />
                                            </tr>
                                        </thead>
                                        <tbody>
                                            {withIssues.map(s => (
                                                <tr key={s.system} style={{borderBottom: '1px solid var(--border-color)'}}>
                                                    <td style={{padding: '8px 6px'}}>{s.full_name || s.system}{s.error && <span style={{color: 'var(--accent-pink)'}}> (scan failed)</span>}</td>
                                                    {HEALTH_COLUMNS.map(c => cell(s.counts[c.key] || 0, c))}
                                                    <td style={{padding: '4px 6px', textAlign: 'right'}}>
                                                        <button className="btn btn-secondary btn-small" disabled={!!fixing} onClick={() => onReview(s.system)}>Review</button>
                                                    </td>
                                                </tr>
                                            ))}
                                            <tr style={{color: 'var(--text-secondary)'}}>
                                                <td style={{padding: '8px 6px', fontWeight: 600}}>Total</td>
                                                {HEALTH_COLUMNS.map(c => <td key={c.key} style={{textAlign: 'center', padding: '8px 6px', fontWeight: 600}}>{totals[c.key] || '·'}</td>)}
                                                <td />
                                            </tr>
                                        </tbody>
                                    </table>
                                </div>
                            )}
                            {clean.length > 0 && (
                                <div style={{marginTop: 12, fontSize: 12, color: 'var(--text-secondary)'}}>
                                    Nothing to fix in {clean.length} system{clean.length === 1 ? '' : 's'}: {clean.map(s => s.full_name || s.system).join(', ')}.
                                </div>
                            )}
                        </>
                    )}
                </Modal>
            );
        }

        // Asks what to do with unsaved edits before switching game or system
        function UnsavedChangesModal({ gameName, onSave, onDiscard, onCancel, saving }) {
            return (
                <div style={{position:'fixed',inset:0,background:'rgba(0,0,0,0.7)',display:'flex',alignItems:'center',justifyContent:'center',zIndex:1100}} {...backdropClose(onCancel)}>
                    <div style={{background:'var(--bg-modal)',padding:24,borderRadius:8,maxWidth:440,width:'90%',boxShadow:'0 8px 32px rgba(0,0,0,0.4)'}} onClick={e => e.stopPropagation()}>
                        <h2 style={{marginBottom:12,fontSize:18}}>Unsaved changes</h2>
                        <p style={{color:'var(--text-secondary)',marginBottom:20,lineHeight:1.5}}>
                            <b style={{color:'var(--text-primary)'}}>{gameName}</b> has changes that haven't been saved to gamelist.xml.
                        </p>
                        <div style={{display:'flex',gap:8,justifyContent:'flex-end',flexWrap:'wrap'}}>
                            <button className="btn btn-secondary" onClick={onCancel} disabled={saving}>Keep editing</button>
                            <button className="btn btn-secondary" onClick={onDiscard} disabled={saving}>Discard</button>
                            <button className="btn btn-primary" onClick={onSave} disabled={saving}>{saving ? 'Saving...' : 'Save'}</button>
                        </div>
                    </div>
                </div>
            );
        }

        // Scan results for one system, with an action for each kind of problem
        function ScanPanel({ result, system, onClose, onChanged, showNotification }) {
            // Duplicates: which copy to keep, per group (defaults to the suggestion)
            const [keeps, setKeeps] = React.useState({});
            React.useEffect(() => { setKeeps({}); }, [result]);
            const keepOf = (group) => keeps[group.id] || group.keep;
            const sections = [
                {
                    key: 'multi_disc',
                    title: 'Multi-disc games without a playlist',
                    help: "These discs belong to one game. Creating an .m3u playlist makes them one entry in EmulationStation (swap discs from the emulator's menu). The disc entries' details and disc 1's media move to the playlist entry. Disc files aren't moved.",
                    items: result.multi_disc || [],
                    id: item => item.m3u,
                    defaultChecked: () => true,
                    render: item => (
                        <>
                            <div>{item.name}</div>
                            <div style={{color:'var(--text-secondary)',fontSize:11}}>{item.m3u} ← {item.discs.map(d => d.split('/').pop()).join(' + ')}</div>
                        </>
                    ),
                    action: 'Create .m3u',
                    run: items => ({ url: 'multi-disc/create', body: { m3us: items.map(i => i.m3u) } }),
                },
                {
                    key: 'saves_in_roms',
                    title: 'Saves inside the ROM folder',
                    help: 'Saves and save states belong only in the top-level saves and savestates folders (an emulator saving next to the ROM means its save folder setting is missing). Moving puts them in save-backups/in-rom-folders/ on the NAS, where nothing syncs them; copy one into saves/ or savestates/ if you still need it.',
                    items: result.saves_in_roms || [],
                    id: item => item,
                    defaultChecked: () => true,
                    render: item => <div>{item}</div>,
                    action: 'Move out of roms',
                    run: items => ({ url: 'saves-in-roms/move', body: { paths: items } }),
                },
                {
                    key: 'duplicates',
                    title: 'Possible duplicates',
                    help: 'The same game more than once (other regions, revisions or a copy with a different file name). Pick the copy to keep; the others move to RetroGames/retromanager/duplicates/ (not deleted), and their play counts, details and any media the kept copy lacks carry over.',
                    items: result.duplicates || [],
                    id: item => item.id,
                    defaultChecked: () => false,
                    render: item => (
                        <>
                            <div style={{fontWeight:600,marginBottom:4}}>{item.name}</div>
                            {item.copies.map(c => {
                                const kept = keepOf(item) === c.path;
                                return (
                                    <div key={c.path} role="radio" aria-checked={kept} tabIndex={0}
                                        onClick={e => { e.preventDefault(); setKeeps(prev => ({ ...prev, [item.id]: c.path })); }}
                                        onKeyDown={e => { if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); setKeeps(prev => ({ ...prev, [item.id]: c.path })); } }}
                                        style={{display:'flex',gap:8,alignItems:'baseline',padding:'2px 0',cursor:'pointer',opacity: kept ? 1 : 0.75}}>
                                        <span style={{color: kept ? 'var(--success)' : 'var(--text-secondary)',width:44,flexShrink:0,fontSize:11}}>{kept ? '● Keep' : '○ Move'}</span>
                                        <span style={{flex:1,minWidth:0}}>
                                            {c.path}
                                            <span style={{color:'var(--text-secondary)',fontSize:11,marginLeft:6}}>
                                                {[formatBytes(c.size), c.name ? 'in gamelist' : 'no entry', c.media ? `${c.media} media` : 'no media',
                                                  c.playcount ? `played ${c.playcount}×` : null].filter(Boolean).join(' · ')}
                                            </span>
                                        </span>
                                    </div>
                                );
                            })}
                        </>
                    ),
                    action: 'Move extra copies aside',
                    run: items => ({ url: 'duplicates/resolve', body: { groups: items.map(g => ({
                        keep: keepOf(g), remove: g.copies.map(c => c.path).filter(p => p !== keepOf(g)),
                    })) } }),
                },
                {
                    key: 'truncated_names',
                    title: 'Names missing their first letters',
                    help: "These names are the ROM's file name with the first letter or two cut off (a Skraper glitch). Fixing puts the missing letters back; nothing else changes.",
                    items: result.truncated_names || [],
                    id: item => item.path,
                    defaultChecked: () => true,
                    render: item => (
                        <>
                            <div style={{textDecoration:'line-through',color:'var(--text-secondary)'}}>{item.name}</div>
                            <div>→ {item.fixed}</div>
                        </>
                    ),
                    action: 'Fix names',
                    run: items => ({ url: 'names/fix', body: { paths: items.map(i => i.path) } }),
                },
                {
                    key: 'name_style',
                    title: 'Names not in house style',
                    help: 'Series and subtitle split by a colon ("Star Wars: Rogue Leader - Rogue Squadron II"), "Legend of Zelda, The" moved to "The Legend of Zelda", region/language tags removed, Title Case, Pokémon with its é. Untick any you want to keep as they are.',
                    items: result.name_style || [],
                    id: item => item.path,
                    defaultChecked: () => true,
                    render: item => (
                        <>
                            <div style={{textDecoration:'line-through',color:'var(--text-secondary)'}}>{item.name}</div>
                            <div>→ {item.styled}</div>
                        </>
                    ),
                    action: 'Rename',
                    run: items => ({ url: 'names/style', body: { paths: items.map(i => i.path) } }),
                },
                {
                    key: 'disc_tracks',
                    title: 'Disc track files listed as games',
                    help: "These gamelist entries are for a disc's track files (named in its .cue), not separate games. Merging copies any details only the track entry has onto the disc's entry, then removes the track entry. No files are touched.",
                    items: result.disc_tracks || [],
                    id: item => item.path,
                    defaultChecked: () => true,
                    render: item => (
                        <>
                            <div>{item.path}</div>
                            <div style={{color:'var(--text-secondary)',fontSize:11}}>part of {item.disc}</div>
                        </>
                    ),
                    action: 'Merge into disc',
                    run: items => ({ url: 'disc-tracks/merge', body: { paths: items.map(i => i.path) } }),
                },
                {
                    key: 'relink',
                    title: 'Entries pointing at a wrong file name',
                    help: 'These gamelist entries have no ROM, but a ROM with a nearly identical name has no entry. Relinking points the entry (and its metadata) at the real file, and renames media saved under the wrong name.',
                    items: result.relink,
                    id: item => item.from,
                    defaultChecked: item => item.score >= 0.9,
                    render: item => (
                        <>
                            <div style={{textDecoration:'line-through',color:'var(--text-secondary)'}}>{item.from}</div>
                            <div>→ {item.to} <span style={{color: item.score >= 0.97 ? 'var(--success)' : 'var(--accent-orange)',fontSize:11,marginLeft:6}}>{Math.round(item.score * 100)}% match</span></div>
                        </>
                    ),
                    action: 'Relink',
                    run: items => ({ url: 'relink', body: { pairs: items.map(i => ({ from: i.from, to: i.to })) } }),
                },
                {
                    key: 'media_links',
                    title: 'Media not linked in the gamelist',
                    help: "EmulationStation only shows the <image>, <thumbnail> and <video> set in gamelist.xml. These are empty or point at a missing file, but matching media exists.",
                    items: result.media_links,
                    id: item => item.path,
                    defaultChecked: () => true,
                    render: item => (
                        <>
                            <div>{item.name || item.path}</div>
                            <div style={{color:'var(--text-secondary)',fontSize:11}}>
                                {Object.entries(item.fields).map(([f, p]) => `${f} ← ${p.split('/').slice(-2, -1)[0]}`).join(' · ')}
                            </div>
                        </>
                    ),
                    action: 'Link media',
                    run: items => ({ url: 'link-media', body: { paths: items.map(i => i.path) } }),
                },
                {
                    key: 'new_roms',
                    title: 'ROMs without a gamelist entry',
                    help: 'Creates a basic entry named after the file and links any matching media. Scrape afterwards to fill in the details.',
                    items: result.new_roms,
                    id: item => item,
                    defaultChecked: () => true,
                    render: item => <div>{item}</div>,
                    action: 'Create entries',
                    run: items => ({ url: 'entries/create', body: { rom_paths: items } }),
                },
                {
                    key: 'orphaned_metadata',
                    title: 'Gamelist entries with no ROM',
                    help: 'No matching ROM was found. Removing deletes only the gamelist entry; no files are touched.',
                    items: result.orphaned_metadata,
                    id: item => item.path,
                    defaultChecked: () => false,
                    render: item => (
                        <>
                            <div>{item.name || item.path}</div>
                            <div style={{color:'var(--text-secondary)',fontSize:11}}>{item.path}</div>
                        </>
                    ),
                    action: 'Remove from gamelist',
                    run: items => ({ url: 'entries/remove', body: { paths: items.map(i => i.path) } }),
                },
                {
                    key: 'orphaned_media',
                    title: 'Media files nothing uses',
                    help: `No ROM matches these and no gamelist entry refers to them. Moving puts them in ${result.media_system}/_orphaned/ so you can restore them by hand.`,
                    items: result.orphaned_media,
                    id: item => item,
                    defaultChecked: () => false,
                    render: item => <div>{item.split('/').slice(1).join('/')}</div>,
                    action: 'Move to _orphaned',
                    run: items => ({ url: 'orphaned-media/move', body: { files: items } }),
                },
            ];

            const initialSelection = () => {
                const selection = {};
                sections.forEach(s => s.items.forEach(item => { selection[`${s.key}:${s.id(item)}`] = s.defaultChecked(item); }));
                return selection;
            };
            const [selected, setSelected] = React.useState(initialSelection);
            const [busy, setBusy] = React.useState(null);
            React.useEffect(() => { setSelected(initialSelection()); }, [result]);

            const toggle = (key) => setSelected(prev => ({ ...prev, [key]: !prev[key] }));
            const setAll = (section, value) => setSelected(prev => {
                const next = { ...prev };
                section.items.forEach(item => { next[`${section.key}:${section.id(item)}`] = value; });
                return next;
            });

            const runAction = async (section) => {
                const items = section.items.filter(item => selected[`${section.key}:${section.id(item)}`]);
                if (!items.length) return;
                const { url, body } = section.run(items);
                setBusy(section.key);
                try {
                    const res = await fetch(`${API_BASE}/api/systems/${encodeURIComponent(system.name)}/${url}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(body),
                    });
                    const data = await res.json();
                    if (!data.success) {
                        showNotification(data.error || `${section.action} failed`, 'error');
                    } else {
                        const backup = data.backup ? ` (backup: ${data.backup})` : '';
                        const problems = data.errors && data.errors.length ? `, ${data.errors.length} failed` : '';
                        const media = data.renamed_media ? `, ${data.renamed_media} media files renamed` : '';
                        showNotification(`${section.action}: ${data.changed} done${media}${problems}${backup}`, problems ? 'error' : 'success');
                    }
                } catch (err) {
                    showNotification(`${section.action} failed: ${err.message}`, 'error');
                } finally {
                    setBusy(null);
                    onChanged();
                }
            };

            const total = sections.reduce((n, s) => n + s.items.length, 0);

            return (
                <Modal open={true} onClose={onClose}>
                    <h2 style={{marginBottom:4}}>Scan: {system.full_name || system.name}</h2>
                    <div style={{color:'var(--text-secondary)',fontSize:13,marginBottom:20}}>
                        {total === 0 ? 'Everything matches. Nothing to fix.' : 'Changes to gamelist.xml make a dated backup first (restore it from the settings button).'}
                    </div>
                    {sections.filter(s => s.items.length > 0).map(section => {
                        const count = section.items.filter(item => selected[`${section.key}:${section.id(item)}`]).length;
                        return (
                            <div key={section.key} style={{marginBottom:20,background:'var(--bg-secondary)',border:'1px solid var(--border-color)',borderRadius:6,padding:14}}>
                                <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',gap:12,flexWrap:'wrap',marginBottom:6}}>
                                    <h3 style={{fontSize:15,margin:0}}>{section.title} <span style={{color:'var(--accent-orange)'}}>({section.items.length})</span></h3>
                                    <div style={{display:'flex',gap:6}}>
                                        <button className="btn btn-secondary btn-small" onClick={() => setAll(section, true)}>All</button>
                                        <button className="btn btn-secondary btn-small" onClick={() => setAll(section, false)}>None</button>
                                        <button className="btn btn-primary btn-small" disabled={!count || busy} onClick={() => runAction(section)}>
                                            {busy === section.key ? 'Working...' : `${section.action} (${count})`}
                                        </button>
                                    </div>
                                </div>
                                <div style={{color:'var(--text-secondary)',fontSize:12,marginBottom:10,lineHeight:1.4}}>{section.help}</div>
                                <div style={{maxHeight:240,overflowY:'auto',display:'flex',flexDirection:'column',gap:4}}>
                                    {section.items.map(item => {
                                        const key = `${section.key}:${section.id(item)}`;
                                        return (
                                            <label key={key} style={{display:'flex',gap:10,alignItems:'flex-start',padding:'6px 8px',background:'var(--bg-tertiary)',borderRadius:4,fontSize:13,cursor:'pointer',wordBreak:'break-word'}}>
                                                <input type="checkbox" checked={!!selected[key]} onChange={() => toggle(key)} style={{marginTop:3}} />
                                                <div style={{flex:1}}>{section.render(item)}</div>
                                            </label>
                                        );
                                    })}
                                </div>
                            </div>
                        );
                    })}
                </Modal>
            );
        }

        function Notification({ message, type }) {
    return <div className={`notification ${type}`}>{message}</div>;
}

        // Drawn on document.body so no panel's stacking order can cover it
        function Modal({ open, onClose, children }) {
    if (!open) return null;
    return ReactDOM.createPortal(
        <div style={{
            position: 'fixed',
            top: 0,
            left: 0,
            width: '100vw',
            height: '100vh',
            background: 'rgba(0,0,0,0.7)',
            display: 'flex',
            alignItems: 'center',
            justifyContent: 'center',
            zIndex: 1000
        }} {...backdropClose(onClose)}>
            <div style={{
                background: 'var(--bg-modal)',
                padding: 24,
                borderRadius: 8,
                maxHeight: '95vh',
                minWidth: '65%',
                boxShadow: '0 8px 32px rgba(0,0,0,0.4)',
                position: 'relative',
                overflowY: 'auto'
            }} onClick={e => e.stopPropagation()}>
                <button style={{
                    position: 'absolute',
                    top: 12,
                    right: 12,
                    background: 'var(--accent-pink)',
                    color: 'white',
                    border: 'none',
                    borderRadius: 4,
                    padding: '6px 12px',
                    cursor: 'pointer',
                    fontWeight: 600
                }} onClick={onClose}>Close</button>
                {children}
            </div>
        </div>,
        document.body
    );
}

        // React 18 compatible rendering
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
