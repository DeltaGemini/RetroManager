                                    <div className="active-filters">
                                        {activeChips.map(([key, label, remove]) => (
                                            <button key={key} className="fchip on" onClick={remove} aria-label={`Remove filter ${label}`}>{label} <span aria-hidden="true">×</span></button>
                                        ))}
                                        <button className="link-button" onClick={() => setFilters(EMPTY_FILTERS)}>Clear all</button>
                                    </div>
                                )}
                                {filteredGames.length !== games.length && (
                                    <div className="game-list-count">Showing {filteredGames.length} of {games.length}</div>
                                )}
                            </>
                        )}
                    </div>
                    {bulkOpen && system && (
                        <BulkScrapePanel system={system} games={games} onClose={() => setBulkOpen(false)} onDone={() => onReload && onReload()} />
                    )}
                    <Modal open={settingsOpen} onClose={()=>setSettingsOpen(false)}>
                        <h2 style={{marginBottom:16}}>Game List Settings</h2>
                        <div style={{marginBottom:24}}>
                            <b>Backup and maintenance options for this system's gamelist.</b>
                        </div>
                        <button className="btn btn-primary" style={{marginBottom:12}} onClick={handleBackupGamelist}>Back up gamelist.xml</button>
                        <div style={{color:'var(--text-secondary)',fontSize:13,marginBottom:16}}>Backup will create a dated copy of gamelist.xml in the system folder.</div>
                        <div style={{marginBottom:8,fontWeight:'bold'}}>Restore from backup:</div>
                        {loadingBackups ? (
                            <div style={{color:'var(--text-secondary)'}}>Loading backups...</div>
                        ) : backups.length === 0 ? (
                            <div style={{color:'var(--text-secondary)'}}>No backups found.</div>
                        ) : (
                            <div style={{marginBottom:12}}>
                                <select value={selectedBackup || ''} onChange={e => setSelectedBackup(e.target.value)} style={{marginRight:8, height:36, borderRadius:4, border:'1px solid var(--border-color)', background:'var(--bg-tertiary)', color:'var(--text-primary)', padding:'0 12px', fontSize:14}}>
                                    <option value='' disabled>Select a backup...</option>
                                    {backups.map(b => <option key={b} value={b}>{b}</option>)}
                                </select>
                                <button className="btn btn-secondary" disabled={!selectedBackup || restoring} onClick={handleRestoreBackup}>
                                    {restoring ? 'Restoring...' : 'Restore'}
                                </button>
                            </div>
                        )}
                        <div style={{color:'var(--text-secondary)',fontSize:12}}>Restoring will overwrite the current gamelist.xml with the selected backup.</div>
                    </Modal>
                    {!system ? (
                        <div className="empty-state">
                            <div className="empty-icon">🕹️</div>
                            <p>Pick a system on the left to see its games</p>
                        </div>
                    ) : loading ? (
                        <div className="loading"><div className="spinner"></div></div>
                    ) : filteredGames.length === 0 ? (
                        <div style={{color: 'var(--text-secondary)', fontSize: '14px', textAlign: 'center', padding: '40px 0'}}>
                            {games.length ? 'No games match the search or filter.' : 'No games found for this system.'}
                        </div>
                    ) : (
                        <>
                        {filteredGames.map(game => {
                            const background = getGameBackground(game);
                            return (
                            <div key={game.path} data-path={game.path} className={`game-item${selectedGame?.path === game.path ? ' active' : ''}${background ? ' has-bg' : ''}`}>
                                {background && (
                                    <img className="game-bg" src={mediaURL(background)} alt="" loading="lazy" decoding="async"
                                        onError={e => { e.target.style.display = 'none'; }} />
                                )}
                                <div className="game-scrim" />
                                <div className="game-card-content" onClick={() => onGameSelect(game)} style={{flex:1, display:'flex'}}>
                                    <div className="game-thumbnail">
                                        {getGameThumbnail(game) ? (
                                            <img
                                                src={mediaURL(getGameThumbnail(game))}
                                                alt={game.name}
                                                onError={e => { e.target.style.display = 'none'; }}
                                            />
                                        ) : (
                                            <div className="game-thumbnail-placeholder">🎮</div>
                                        )}
                                    </div>
                                    <div className="game-info">
                                        <div className="game-name" title={game.name}>
                                            {splitGameName(game.name).title}
                                            {game.releasedate && game.releasedate.length >= 4 ?
                                                <span style={{fontWeight:400,color:'var(--text-secondary)'}}> · {game.releasedate.slice(0, 4)}</span> : null}
                                            {splitGameName(game.name).tags && <div className="game-tags">{splitGameName(game.name).tags}</div>}
                                        </div>
                                        <div className="game-status">
                                            {!game.has_metadata && <span className="status-badge status-missing">Missing Metadata</span>}
                                            {!game.rom_exists && <span className="status-badge status-missing">ROM Missing</span>}
                                        </div>
                                    </div>
                                </div>
                            </div>
                            );
                        })}
                        </>
                    )}
                    {/* Delete modal moved to DetailPanel */}
                </div>
            );
        }

        // Fields compared to decide whether the detail panel has unsaved edits
        const EDITABLE_FIELDS = ['name', 'desc', 'developer', 'publisher', 'genre', 'releasedate', 'players', 'rating', 'image', 'thumbnail', 'video'];

        // Media folders that fill <image>, <thumbnail> and <video>, best first.
        // Keep in step with LINK_PREFERENCES in backend/media_index.py.
        const LINK_PREFERENCES = {
            image: ['images', 'mix', 'box2d', 'screenshot'],
            thumbnail: ['screenshottitle', 'screenshot', 'box2d', 'wheel'],
            video: ['videos'],
        };

        // Media folder of a path like "Nintendo 3DS/images/x.png" or "../media/Nintendo 3DS/images/x.png"
        const mediaFolderOf = (path) => {
            if (!path || typeof path !== 'string') return '';
            const parts = path.split('/');
            return parts.length >= 3 ? parts[parts.length - 2] : '';
        };

        // Fill empty <image>/<thumbnail>/<video> from the game's matched media files
        const autoFillXmlMedia = (data) => {
            const filled = { ...data };
            let changed = 0;
            Object.entries(LINK_PREFERENCES).forEach(([xmlField, folders]) => {
                if (filled[xmlField]) return;
                const folder = folders.find(f => typeof filled[f] === 'string' && filled[f]);
                if (folder) {
                    filled[xmlField] = filled[folder];
                    changed++;
                }
            });
            return { data: filled, changed };
        };

        function DetailPanel({ game, system, onSave, onDeleted, onResizeStart, showNotification, detailStateRef }) {
            const [deleteOpen, setDeleteOpen] = React.useState(false);
            const [deleteRom, setDeleteRom] = React.useState(false);
            const [deleteMedia, setDeleteMedia] = React.useState(false);
            const [deleteConfirmText, setDeleteConfirmText] = React.useState('');
            const [deleting, setDeleting] = React.useState(false);
            const [scraperOpen, setScraperOpen] = React.useState(false);

            const openDeleteDialog = () => {
                setDeleteRom(false);
                setDeleteMedia(false);
                setDeleteConfirmText('');
                setDeleteOpen(true);
            };

            const handleDeleteGame = async () => {
                if (!system || !game) return;
                setDeleting(true);
                try {
                    const params = new URLSearchParams();
                    if (deleteRom) params.set('delete_rom', '1');
                    if (deleteMedia) params.set('delete_media', '1');
                    const cleanPath = game.path.startsWith('./') ? game.path.slice(2) : game.path;
                    const url = `${API_BASE}/api/systems/${encodeURIComponent(system.name)}/games/${encodeURIComponent(cleanPath)}?${params}`;
                    const res = await fetch(url, { method: 'DELETE' });
                    const data = await res.json();
                    if (data.success) {
                        setDeleteOpen(false);
                        const files = data.deleted_files ? data.deleted_files.length : 0;
                        const parts = [data.removed_entry ? 'gamelist entry removed' : null, files ? `${files} file${files > 1 ? 's' : ''} deleted` : null].filter(Boolean);
                        if (showNotification) showNotification(`${game.name}: ${parts.join(', ')}`, data.errors && data.errors.length ? 'error' : 'success');
                        if (onDeleted) onDeleted();
                    } else if (showNotification) {
                        showNotification(data.error || 'Failed to delete game', 'error');
                    }
                } catch (err) {
                    if (showNotification) showNotification('Failed to delete game', 'error');
                } finally {
                    setDeleting(false);
                }
            };
            const [formData, setFormData] = useState(null);
            // Add state for image/thumbnail type selection
            const imageTypes = [
                { key: '', label: 'None' },
                { key: 'box2d', label: 'Box 2D' },
                { key: 'fanart', label: 'Fanart' },
                { key: 'screenshot', label: 'Screenshot' },
                { key: 'screenshottitle', label: 'Screenshot Title' },
                { key: 'wheel', label: 'Wheel' },
                { key: 'box3d', label: 'Box 3D' },
                { key: 'images', label: 'Images' },
                { key: 'posters', label: 'Posters' }
            ];
            const [imageType, setImageType] = useState(null);
            const [thumbnailType, setThumbnailType] = useState(null);

            useEffect(() => {
                if (game) {
                    setFormData({ ...game });
                    setImageType(
                        game.hasOwnProperty('image_type')
                            ? (game.image_type === undefined || game.image_type === null ? '' : game.image_type)
                            : 'box2d'
                    );
                    setThumbnailType(
                        game.hasOwnProperty('thumbnail_type')
                            ? (game.thumbnail_type === undefined || game.thumbnail_type === null ? '' : game.thumbnail_type)
                            : 'wheel'
                    );
                }
            }, [game]);
            const [lightboxUrl, setLightboxUrl] = useState(null);

            const normalizeValue = (v) => (v === undefined || v === null) ? '' : String(v);
            const isDirty = !!(game && formData && formData.path === game.path && (
                EDITABLE_FIELDS.some(f => normalizeValue(formData[f]) !== normalizeValue(game[f])) ||
                Object.values(formData).some(v => v instanceof File)
            ));
            const buildSavePayload = () => ({ ...formData, image_type: imageType, thumbnail_type: thumbnailType });

            // Let the App check for unsaved edits before navigating away
            useEffect(() => {
                if (detailStateRef) detailStateRef.current = { dirty: isDirty, save: () => onSave(buildSavePayload()) };
            });
            if (!game || !formData) return (
                <div className="detail-panel">
                    <div className="empty-state">
                        <div className="empty-icon">📋</div>
                        <p>Select a game to view and edit metadata</p>
                    </div>
                </div>
            );

            const handleChange = (field, value) => setFormData({ ...formData, [field]: value });
            
            // Build list of available media options
            const mediaOptions = [
                { key: '', label: 'None' },
                { key: 'box2d', label: 'Box 2D', path: formData.box2d },
                { key: 'fanart', label: 'Fanart', path: formData.fanart },
                { key: 'screenshot', label: 'Screenshot', path: formData.screenshot },
                { key: 'screenshottitle', label: 'Screenshot Title', path: formData.screenshottitle },
                { key: 'wheel', label: 'Wheel', path: formData.wheel },
                { key: 'box3d', label: 'Box 3D', path: formData.box3d },
                { key: 'images', label: 'Images', path: formData.images },
                { key: 'mix', label: 'Mix', path: formData.mix },
                { key: 'posters', label: 'Posters', path: formData.posters },
                { key: 'manuals', label: 'Manuals', path: formData.manuals },
                { key: 'videos', label: 'Videos', path: formData.videos }
            ];
            const handleSubmit = () => onSave(buildSavePayload());

            const handleAutoFill = () => {
                const { data, changed } = autoFillXmlMedia(formData);
                if (changed) {
                    setFormData(data);
                    if (showNotification) showNotification(`Filled ${changed} field${changed > 1 ? 's' : ''}. Click Save to write them.`, 'info');
                } else if (showNotification) {
                    showNotification('Nothing to fill: the fields are set or no matching media was found', 'info');
                }
            };

            // Value for an XML media dropdown: the folder the current file lives in
            const xmlMediaValue = (xmlField, options) => {
                const current = formData[xmlField];
                if (!current) return '';
                const folder = mediaFolderOf(current);
                return options.some(o => o.key === folder) ? folder : '__other';
            };

            const handleXmlMediaChange = (xmlField, folder) => {
                if (folder === '__other') return;
                if (folder === '') {
                    handleChange(xmlField, undefined);
                    return;
                }
                const option = mediaOptions.find(o => o.key === folder);
                if (option && typeof option.path === 'string') handleChange(xmlField, option.path);
            };

            const renderXmlMediaSelect = (xmlField, options) => {
                const value = xmlMediaValue(xmlField, options);
                return (
                    <select
                        value={value}
                        onChange={(e) => handleXmlMediaChange(xmlField, e.target.value)}
                        style={{
                            width: '100%',
                            padding: '8px 12px',
                            background: 'var(--bg-tertiary)',
                            borderRadius: 4,
                            border: '1px solid var(--border-color)',
                            fontSize: 12,
                            color: 'var(--text-primary)',
                            boxSizing: 'border-box',
                            outline: 'none',
                            cursor: 'pointer'
                        }}
                        onFocus={(e) => e.target.style.borderColor = 'var(--accent-pink)'}
                        onBlur={(e) => e.target.style.borderColor = 'var(--border-color)'}
                    >
                        {value === '__other' && (
                            <option value="__other">Other file: {String(formData[xmlField]).split('/').pop()}</option>
                        )}
                        {options.map(opt => {
                            const usable = typeof opt.path === 'string' && opt.path;
                            return (
                                <option key={opt.key} value={opt.key} disabled={opt.key !== '' && !usable}>
                                    {opt.key === '' ? opt.label : `${opt.label}${usable ? '' : ' (empty)'}`}
                                </option>
                            );
                        })}
                    </select>
                );
            };

            const mediaURL = (mediaPath) => {
                if (!mediaPath) return null;
                // If it's a File object (newly selected), create an object URL for preview
                if (mediaPath instanceof File) {
                    return URL.createObjectURL(mediaPath);
                }
                // If it's already a full URL (external), return as-is
                if (typeof mediaPath === 'string' && (mediaPath.startsWith('http://') || mediaPath.startsWith('https://'))) {
                    return mediaPath;
                }
                // Otherwise it's a string path - encode each segment separately
                const encoded = mediaPath.split('/').map(part => encodeURIComponent(part)).join('/');
                return `${API_BASE}/api/media/${encoded}`;
            };

            const handleUpload = (mediaType, file) => {
                if (!file) return;
                // Store the file in formData - it will be uploaded when user clicks Save
                setFormData(prev => ({ ...prev, [mediaType]: file }));
                if (showNotification) showNotification(`${mediaType} file selected. Click Save to apply.`, 'info');
            };

            const handleApplyMetadata = (mergedMetadata) => {
                setFormData(autoFillXmlMedia(mergedMetadata).data);
                if (showNotification) showNotification('Metadata updated from scraper. Click Save to write it.', 'success');
            };

            // Compute background style for screenshot
            let screenshotUrl = null;
            if (formData && formData.screenshot) {
                screenshotUrl = mediaURL(formData.screenshot);
            }
        return (
            <div className="detail-panel" style={{position:'relative', overflow:'hidden', display:'flex', flexDirection:'column', height:'100%'}}>
                {/* True background layer for screenshot */}
                {screenshotUrl && (
                    <React.Fragment>
                        <div style={{
                            position: 'absolute',
                            zIndex: 0,
                            top: 0,
                            left: 0,
                            width: '100%',
                            height: '100%',
                            backgroundImage: `url('${screenshotUrl}')`,
                            backgroundSize: 'cover',
                            backgroundPosition: 'center',
                            backgroundRepeat: 'no-repeat',
                            pointerEvents: 'none',
                        }} />
                        <div style={{
                            position: 'absolute',
                            zIndex: 1,
                            top: 0,
                            left: 0,
                            width: '100%',
                            height: '100%',
                            background: 'var(--panel-scrim)',
                            pointerEvents: 'none',
                        }} />
                    </React.Fragment>
                )}
                <div style={{position:'relative',zIndex:2, flex:1, overflowY:'auto', minHeight:0, paddingRight:'24px'}}>
                    <div className="detail-header">
                        <div>
                            <h1 className="detail-title">{formData.name}</h1>
                            <div className="detail-path" style={{fontFamily:'monospace', color:'var(--text-secondary)', fontSize:'14px', marginTop:'-4px', marginBottom:'6px'}}>{formData.path || ''}</div>
                            {!formData.has_metadata && <span className="status-badge status-missing">Missing Metadata</span>}
                        </div>
                        <div className="detail-actions" style={{display:'flex',gap:8}}>
                            <button className="btn btn-small" style={{background:'var(--accent-pink)',color:'#fff'}} onClick={handleSubmit} title={isDirty ? 'You have unsaved changes' : 'Save to gamelist.xml'}>{isDirty ? 'Save •' : 'Save'}</button>
                            <button className="btn btn-small" style={{background:'var(--accent-blue)',color:'#fff'}} onClick={()=>setScraperOpen(true)}>Scrape</button>
                            <button className="btn btn-small btn-secondary" onClick={openDeleteDialog}>Delete</button>
                        </div>
                    </div>

                    <div className="form-grid">
                        <div className="form-group">
                            <label>Title</label>
                            <input type="text" value={formData.name} onChange={(e) => handleChange('name', e.target.value)} />
                        </div>

                        <div className="form-group">
                            <label>Description</label>
                            <textarea value={formData.desc || ''} onChange={(e) => handleChange('desc', e.target.value)} />
                        </div>

                        <div className="form-pair" style={{display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '20px'}}>
                            <div className="form-group">
                                <label>Developer</label>
                                <input type="text" value={formData.developer || ''} onChange={(e) => handleChange('developer', e.target.value)} />
                            </div>

                            <div className="form-group">
                                <label>Publisher</label>
                                <input type="text" value={formData.publisher || ''} onChange={(e) => handleChange('publisher', e.target.value)} />
                            </div>
                        </div>

                        <div className="form-triple" style={{display: 'grid', gridTemplateColumns: '1fr 1fr 1fr', gap: '20px'}}>
                            <div className="form-group">
                                <label>Genre</label>
                                <input type="text" value={formData.genre || ''} onChange={(e) => handleChange('genre', e.target.value)} />
                            </div>

                            <div className="form-group">
                                <label>Release Date</label>
                                <input type="date"
                                    value={formData.releasedate ? formData.releasedate.slice(0, 4) + '-' + formData.releasedate.slice(4, 6) + '-' + formData.releasedate.slice(6, 8) : ''}
                                    onChange={e => {
                                        const val = e.target.value;
                                        // YYYY-MM-DD -> EmulationStation's YYYYMMDDT000000
                                        handleChange('releasedate', val ? `${val.replace(/-/g, '')}T000000` : undefined);
                                    }}
                                />
                            </div>

                            <div className="form-group">
                                <label>Players</label>
                                <input type="text" value={formData.players || ''} onChange={(e) => handleChange('players', e.target.value)} />
                            </div>
                        </div>

                        <div className="form-group">
                            <label>Rating</label>
                            <RatingStars value={typeof formData.rating === 'number' ? formData.rating : (formData.rating ? parseFloat(formData.rating) : null)} onChange={(v) => handleChange('rating', v)} />
                        </div>
                    </div>

                    <div style={{marginTop: 24, paddingTop: 16, borderTop: '1px solid var(--border-color)'}}>
                        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:6}}>
                            <h3 style={{fontSize: 14, color: 'var(--accent-pink)', textTransform: 'uppercase', letterSpacing: '1px', margin: 0}}>XML Metadata</h3>
                            <button className="btn btn-secondary btn-small" onClick={handleAutoFill} title="Fill empty Image, Thumbnail and Video from this game's media files">Auto-fill</button>
                        </div>
                        <div style={{fontSize: 12, color: 'var(--text-secondary)', marginBottom: 12}}>What EmulationStation shows for this game. Media files alone aren't enough.</div>
                        <div style={{display: 'flex', flexDirection: 'column', gap: 12}}>
                            <div>
                                <label style={{fontSize: 12, color: 'var(--text-secondary)', display: 'block', marginBottom: 4}}>Image</label>
                                {renderXmlMediaSelect('image', mediaOptions.filter(o => o.key !== 'videos' && o.key !== 'manuals'))}
                            </div>
                            <div>
                                <label style={{fontSize: 12, color: 'var(--text-secondary)', display: 'block', marginBottom: 4}}>Thumbnail</label>
                                {renderXmlMediaSelect('thumbnail', mediaOptions.filter(o => o.key !== 'videos' && o.key !== 'manuals'))}
                            </div>
                            <div>
                                <label style={{fontSize: 12, color: 'var(--text-secondary)', display: 'block', marginBottom: 4}}>Video</label>
                                {renderXmlMediaSelect('video', mediaOptions.filter(o => o.key === '' || o.key === 'videos'))}
                            </div>
                        </div>
                    </div>

                    <LaunchFileSection system={system} game={game} onChanged={onDeleted} showNotification={showNotification} />

                    <XmlPreview system={system} payload={buildSavePayload()} />

                    <SavesSection system={system} game={game} />

                    <div className="media-section">
                        {/*
                        <div style={{display:'flex',alignItems:'center',gap:24,marginBottom:8}}>
                            <h3 style={{marginBottom:0}}>Media Assets</h3>
                            <div style={{display:'flex',alignItems:'center',gap:8}}>
                                <span style={{fontSize:13}}>Image:</span>
                                <select value={imageType || ''} onChange={e => setImageType(e.target.value)} style={{fontSize:13,padding:'2px 8px',borderRadius:4}}>
                                    {imageTypes.map(opt => <option key={opt.key} value={opt.key}>{opt.label}</option>)}
                                </select>
                            </div>
                            <div style={{display:'flex',alignItems:'center',gap:8}}>
                                <span style={{fontSize:13}}>Thumbnail:</span>
                                <select value={thumbnailType || ''} onChange={e => setThumbnailType(e.target.value)} style={{fontSize:13,padding:'2px 8px',borderRadius:4}}>
                                    {imageTypes.map(opt => <option key={opt.key} value={opt.key}>{opt.label}</option>)}
                                </select>
                            </div>
                        </div>
                        */}
                        <div className="media-grid">
                            <MediaUpload label="Images" url={mediaURL(formData.images)} mediaType="images" onUpload={handleUpload} accept="image/*" onImageClick={setLightboxUrl} />
                            <MediaUpload label="Wheel" url={mediaURL(formData.wheel)} mediaType="wheel" onUpload={handleUpload} accept="image/*" onImageClick={setLightboxUrl} />
                            <MediaUpload label="Manuals" url={mediaURL(formData.manuals)} mediaType="manuals" onUpload={handleUpload} accept="application/pdf" onImageClick={setLightboxUrl} />
                            <MediaUpload label="Screenshot Title" url={mediaURL(formData.screenshottitle)} mediaType="screenshottitle" onUpload={handleUpload} accept="image/*" onImageClick={setLightboxUrl} />
                            <MediaUpload label="Screenshot" url={mediaURL(formData.screenshot)} mediaType="screenshot" onUpload={handleUpload} accept="image/*" onImageClick={setLightboxUrl} />
                            <MediaUpload label="Videos" url={mediaURL(formData.videos)} mediaType="videos" onUpload={handleUpload} accept="video/mp4,video/webm,video/avi,video/mkv" onImageClick={setLightboxUrl} />
                            <MediaUpload label="Box 2D" url={mediaURL(formData.box2d)} mediaType="box2d" onUpload={handleUpload} accept="image/*" onImageClick={setLightboxUrl} />
                            <MediaUpload label="Box 3D" url={mediaURL(formData.box3d)} mediaType="box3d" onUpload={handleUpload} accept="image/*" onImageClick={setLightboxUrl} />
                            <MediaUpload label="Spine" url={mediaURL(formData.boxside)} mediaType="boxside" onUpload={handleUpload} accept="image/*" onImageClick={setLightboxUrl} />
                            <MediaUpload label="Fanart" url={mediaURL(formData.fanart)} mediaType="fanart" onUpload={handleUpload} accept="image/*" onImageClick={setLightboxUrl} />
                            <MediaUpload label="Posters" url={mediaURL(formData.posters)} mediaType="posters" onUpload={handleUpload} accept="image/*" onImageClick={setLightboxUrl} />
                        </div>
                    </div>
                    <Modal open={!!lightboxUrl} onClose={() => setLightboxUrl(null)}>
                                    {lightboxUrl && (() => {
                                        // Show PDF, video, or image in modal
                                        if (lightboxUrl.endsWith('.pdf')) {
                                            return <object data={lightboxUrl} type="application/pdf" style={{width:'90vw',height:'80vh',display:'block',margin:'0 auto',borderRadius:8}}><p>PDF cannot be displayed.</p></object>;
                                        } else if (lightboxUrl.match(/\.(mp4|webm|avi|mkv)$/i)) {
                                            return <video src={lightboxUrl} controls autoPlay style={{maxWidth:'90vw',maxHeight:'80vh',display:'block',margin:'0 auto',borderRadius:8}} />;
                                        } else {
                                            return <img src={lightboxUrl} alt="Media" style={{maxWidth:'90vw',maxHeight:'80vh',display:'block',margin:'0 auto',borderRadius:8}} />;
                                        }
                                    })()}
                    </Modal>

                    {/* Scraper popup */}
                    <ScraperSearchPopup 
                        isOpen={scraperOpen}
                        onClose={() => setScraperOpen(false)}
                        gameData={formData}
                        systemName={system?.name}
                        onApplyMetadata={handleApplyMetadata}
                    />

                    {/* Delete confirmation modal */}
                    <Modal open={deleteOpen} onClose={()=>!deleting && setDeleteOpen(false)}>
                        {(() => {
                            const deletesFiles = deleteRom || deleteMedia;
                            const confirmName = game.name || '';
                            const confirmed = !deletesFiles || deleteConfirmText.trim() === confirmName.trim();
                            return (
                                <div style={{maxWidth: 560}}>
                                    <h2 style={{color:'var(--accent-pink)',marginBottom:8}}>Remove {game.name}</h2>
                                    <div style={{color:'var(--text-secondary)',fontSize:13,marginBottom:20,fontFamily:'monospace'}}>{game.path}</div>

                                    <label style={{display:'flex',gap:10,alignItems:'flex-start',marginBottom:12,opacity:game.has_metadata ? 1 : 0.5}}>
                                        <input type="checkbox" checked={!!game.has_metadata} disabled style={{marginTop:3}} />
                                        <span><b>Remove the gamelist entry</b><br/><span style={{color:'var(--text-secondary)',fontSize:13}}>{game.has_metadata ? 'Its name, description and other metadata are lost. The gamelist keeps working without it.' : 'This game has no gamelist entry.'}</span></span>
                                    </label>
                                    <label style={{display:'flex',gap:10,alignItems:'flex-start',marginBottom:12,cursor:'pointer'}}>
                                        <input type="checkbox" checked={deleteRom} onChange={e => setDeleteRom(e.target.checked)} disabled={!game.rom_exists} style={{marginTop:3}} />
                                        <span><b>Also delete the ROM file</b><br/><span style={{color:'var(--text-secondary)',fontSize:13}}>{game.rom_exists ? 'Permanently deletes the file from the NAS.' : 'The ROM file is already missing.'}</span></span>
                                    </label>
                                    <label style={{display:'flex',gap:10,alignItems:'flex-start',marginBottom:20,cursor:'pointer'}}>
                                        <input type="checkbox" checked={deleteMedia} onChange={e => setDeleteMedia(e.target.checked)} style={{marginTop:3}} />
                                        <span><b>Also delete its media files</b><br/><span style={{color:'var(--text-secondary)',fontSize:13}}>Permanently deletes images, video and manual named exactly after this ROM. Files shared with another region's ROM are kept.</span></span>
                                    </label>

                                    {deletesFiles && (
                                        <div style={{background:'rgba(255,107,157,0.1)',border:'1px solid var(--accent-pink)',borderRadius:4,padding:12,marginBottom:20}}>
                                            <div style={{fontSize:13,marginBottom:8}}>Files can't be recovered. Type <b style={{userSelect:'text'}}>{confirmName}</b> to confirm.</div>
                                            <input type="text" value={deleteConfirmText} onChange={e => setDeleteConfirmText(e.target.value)} style={{width:'100%',boxSizing:'border-box',padding:'8px 12px',background:'var(--bg-tertiary)',color:'var(--text-primary)',border:'1px solid var(--border-color)',borderRadius:4}} autoFocus />
                                        </div>
                                    )}

                                    <div style={{display:'flex',gap:12,justifyContent:'flex-end'}}>
                                        <button className="btn btn-secondary" onClick={()=>setDeleteOpen(false)} disabled={deleting}>Cancel</button>
                                        <button className="btn btn-primary" style={{background:'var(--accent-pink)'}} onClick={handleDeleteGame}
                                            disabled={deleting || !confirmed || (!game.has_metadata && !deletesFiles)}>
                                            {deleting ? 'Removing...' : deletesFiles ? 'Delete permanently' : 'Remove from gamelist'}
                                        </button>
                                    </div>
                                </div>
                            );
                        })()}
                    </Modal>
                </div>
            </div>
        );
        }

        const formatBytes = (n) => n < 1024 ? `${n} B` : n < 1048576 ? `${(n / 1024).toFixed(1)} KB` : n < 1073741824 ? `${(n / 1048576).toFixed(1)} MB` : `${(n / 1073741824).toFixed(2)} GB`;
        const capitalize = (t) => t ? t[0].toUpperCase() + t.slice(1) : t;

        // In-game saves and save states for one game, grouped by person (read-only)
        // PC games (DOS, Windows, ScummVM) are folders; pick which program in the
        // folder is the game. Nothing shows for other systems.
        function LaunchFileSection({ system, game, onChanged, showNotification }) {
            const [files, setFiles] = React.useState([]);
            const [choice, setChoice] = React.useState('');
            const [busy, setBusy] = React.useState(false);
            const current = (game?.path || '').replace(/^\.\//, '');

            useEffect(() => {
                setFiles([]);
                if (!system || !game) return;
                let cancelled = false;
                const params = new URLSearchParams({ rom: game.path });
                fetch(`${API_BASE}/api/systems/${encodeURIComponent(system.name)}/launch-files?${params}`)
                    .then(r => r.json())
                    .then(d => { if (!cancelled && d.success) { setFiles(d.files); setChoice(current); } })
                    .catch(() => {});
                return () => { cancelled = true; };
            }, [system?.name, game?.path]);

            if (files.length < 2) return null;
            const apply = async () => {
                setBusy(true);
                try {
                    const res = await fetch(`${API_BASE}/api/systems/${encodeURIComponent(system.name)}/launch-file`, {
                        method: 'POST', headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ from: current, to: choice }),
                    });
                    const d = await res.json();
                    if (d.success) {
                        showNotification(`Now launches ${choice.split('/').pop()}. Gamelist backed up first.`, 'success');
                        onChanged && onChanged();
                    } else showNotification(d.error || 'Could not change the launch file', 'error');
                } catch (err) {
                    showNotification(err.message, 'error');
                }
                setBusy(false);
            };
            return (
                <div style={{marginTop: 24, paddingTop: 16, borderTop: '1px solid var(--border-color)'}}>
                    <h3 style={{fontSize: 14, color: 'var(--accent-pink)', textTransform: 'uppercase', letterSpacing: '1px', marginBottom: 6}}>Launch file</h3>
                    <div style={{fontSize: 12, color: 'var(--text-secondary)', marginBottom: 10}}>
                        This game is a folder. The gamelist points at one program in it; setup, uninstallers and DOSBox are marked.
                    </div>
                    <div style={{display: 'flex', gap: 8, flexWrap: 'wrap'}}>
                        <select value={choice} onChange={e => setChoice(e.target.value)}
                            style={{flex: '1 1 240px', minWidth: 0, padding: '8px 12px', background: 'var(--bg-tertiary)', color: 'var(--text-primary)', border: '1px solid var(--border-color)', borderRadius: 4, fontSize: 12}}>
                            {files.map(f => (
                                <option key={f.path} value={f.path}>
                                    {f.path.split('/').slice(1).join('/')}{f.helper ? '  (helper)' : ''}{f.path === current ? '  ← current' : ''}
                                </option>
                            ))}
                        </select>
                        <button className="btn btn-secondary btn-small" disabled={busy || !choice || choice === current} onClick={apply}>
                            {busy ? 'Changing...' : 'Use this file'}
                        </button>
                    </div>
                </div>
            );
        }

        function SavesSection({ system, game }) {
            const [data, setData] = React.useState(null);
            const [error, setError] = React.useState(null);
            const [expanded, setExpanded] = React.useState({});
            const [preview, setPreview] = React.useState(null);
            const PREVIEW_COUNT = 5;

            useEffect(() => {
                if (!system || !game) return;
                let cancelled = false;
                setData(null);
                setError(null);
                setExpanded({});
                const params = new URLSearchParams({ rom: game.path });
                fetch(`${API_BASE}/api/systems/${encodeURIComponent(system.name)}/saves?${params}`)
                    .then(r => r.json())
                    .then(d => { if (!cancelled) d.success ? setData(d) : setError(d.error || 'Could not load saves'); })
                    .catch(err => { if (!cancelled) setError(err.message); });
                return () => { cancelled = true; };
            }, [system?.name, game?.path]);

            const header = <h3 style={{fontSize: 14, color: 'var(--accent-pink)', textTransform: 'uppercase', letterSpacing: '1px', marginBottom: 6}}>Saves</h3>;
            const wrap = (content) => (
                <div style={{marginTop: 24, paddingTop: 16, borderTop: '1px solid var(--border-color)'}}>{header}{content}</div>
            );

            if (error) return wrap(<div style={{color: 'var(--accent-pink)', fontSize: 13}}>{error}</div>);
            if (!data) return wrap(<div style={{color: 'var(--text-secondary)', fontSize: 13}}>Looking for saves...</div>);
            if (!Object.values(data.available || {}).some(Boolean)) {
                return wrap(<div style={{color: 'var(--text-secondary)', fontSize: 13}}>The saves folders aren't mounted. Add them to docker-compose.yml (see the README).</div>);
            }

            // Each person in the configured order, then the shared in-game saves,
            // then older states that sit outside anyone's folder (collapsed)
            const groupOf = (s) => s.profile !== 'shared' ? s.profile : s.root === 'saves' ? 'shared-saves' : 'shared-states';
            const GROUP_LABELS = { 'shared-saves': 'In-game saves (shared)', 'shared-states': "Old save states, not in a person's folder" };
            const groups = [...data.profiles, 'shared-saves', 'shared-states']
                .map(profile => ({ profile, items: data.saves.filter(s => groupOf(s) === profile) }))
                .filter(g => g.items.length);

            if (!groups.length) {
                return wrap(<div style={{color: 'var(--text-secondary)', fontSize: 13}}>No saves or save states for this game.</div>);
            }

            const row = (s) => (
                <div key={`${s.root}/${s.path}`} style={{display: 'flex', gap: 10, alignItems: 'center', padding: '6px 8px', background: 'var(--bg-tertiary)', borderRadius: 4, fontSize: 13}}>
                    <div style={{width: 56, height: 42, flexShrink: 0, borderRadius: 3, overflow: 'hidden', background: 'var(--bg-secondary)', display: 'flex', alignItems: 'center', justifyContent: 'center', cursor: s.screenshot ? 'zoom-in' : 'default'}}
                        onClick={() => s.screenshot && setPreview(`${API_BASE}/api/save-screenshot/${s.root}/${s.screenshot.split('/').map(encodeURIComponent).join('/')}`)}>
                        {s.screenshot
                            ? <img src={`${API_BASE}/api/save-screenshot/${s.root}/${s.screenshot.split('/').map(encodeURIComponent).join('/')}`} alt="" loading="lazy" style={{width: '100%', height: '100%', objectFit: 'cover'}} />
                            : <span style={{fontSize: 18, opacity: 0.6}}>{s.kind === 'save' ? '💾' : '⏸'}</span>}
                    </div>
                    <div style={{flex: 1, minWidth: 0}}>
                        <div style={{fontWeight: 600}}>
                            {s.label}
                            {s.conflict && <span className="status-badge status-missing" style={{marginLeft: 8}} title="Syncthing kept two versions of this file">Sync conflict</span>}
                        </div>
                        <div style={{color: 'var(--text-secondary)', fontSize: 12, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap'}} title={`${s.root}/${s.path}`}>
                            {s.root}/{s.path}
                        </div>
                    </div>
                    <div style={{textAlign: 'right', flexShrink: 0, fontSize: 12}}>
                        <div title={new Date(s.modified).toLocaleString()}>{timeAgo(new Date(s.modified).getTime())}</div>
                        <div style={{color: 'var(--text-secondary)'}}>{formatBytes(s.size)}</div>
                    </div>
                </div>
            );

            return wrap(
                <>
                    <div style={{display: 'flex', gap: 12, alignItems: 'center', flexWrap: 'wrap', fontSize: 12, color: 'var(--text-secondary)', marginBottom: 12}}>
                        <span style={{flex: 1, minWidth: 200}}>
                            Found by file name in the saves and savestates folders.
                            {data.saves.some(s => s.conflict) && ' Resolve sync conflicts in Tools › Saves.'}
                        </span>
                        <a className="btn btn-secondary btn-small" style={{textDecoration: 'none'}}
                            href={`${API_BASE}/api/systems/${encodeURIComponent(system.name)}/saves/download?${new URLSearchParams({ rom: game.path })}`}>
                            Download all (zip)
                        </a>
                    </div>
                    {groups.map(({ profile, items }) => {
                        const open = expanded[profile] ?? profile !== 'shared-states';
                        const showAll = expanded[`${profile}:all`];
                        const shown = showAll ? items : items.slice(0, PREVIEW_COUNT);
                        const newest = items[0];
                        return (
                            <div key={profile} style={{marginBottom: 12}}>
                                <button onClick={() => setExpanded(prev => ({ ...prev, [profile]: !open }))}
                                    style={{background: 'none', border: 'none', color: 'var(--text-primary)', cursor: 'pointer', padding: '4px 0', fontSize: 14, fontWeight: 600, display: 'flex', gap: 8, alignItems: 'baseline', width: '100%', textAlign: 'left'}}>
                                    <span style={{color: 'var(--text-secondary)', width: 10}}>{open ? '▾' : '▸'}</span>
                                    {GROUP_LABELS[profile] || capitalize(profile)}
                                    <span style={{color: 'var(--text-secondary)', fontWeight: 400, fontSize: 12}}>
                                        {items.length} file{items.length > 1 ? 's' : ''} · latest {timeAgo(new Date(newest.modified).getTime())}
                                    </span>
                                </button>
                                {open && (
                                    <div style={{display: 'flex', flexDirection: 'column', gap: 4, marginTop: 4}}>
                                        {shown.map(row)}
                                        {items.length > PREVIEW_COUNT && (
                                            <button className="btn btn-secondary btn-small" style={{alignSelf: 'flex-start', marginTop: 4}}
                                                onClick={() => setExpanded(prev => ({ ...prev, [`${profile}:all`]: !showAll }))}>
                                                {showAll ? 'Show fewer' : `Show all ${items.length}`}
                                            </button>
                                        )}
                                    </div>
                                )}
                            </div>
                        );
                    })}
                    <Modal open={!!preview} onClose={() => setPreview(null)}>
                        {preview && <img src={preview} alt="Save state screenshot" style={{maxWidth: '90vw', maxHeight: '80vh', display: 'block', margin: '0 auto', borderRadius: 8, imageRendering: 'pixelated'}} />}
                    </Modal>
                </>
            );
        }

        // Five stars for a 0-1 rating (each star is 0.2). Clicking the current value clears it.
        function RatingStars({ value, onChange }) {
            const rating = typeof value === 'number' && !isNaN(value) ? Math.min(Math.max(value, 0), 1) : null;
            const stars = rating === null ? 0 : rating * 5;
            return (
                <div className="rating-stars">
                    <div role="radiogroup" aria-label="Rating">
                        {[1, 2, 3, 4, 5].map(n => {
                            const fill = Math.min(Math.max(stars - (n - 1), 0), 1);
                            const newValue = Math.round(n * 0.2 * 100) / 100;
                            return (
                                <button key={n} type="button" role="radio" aria-checked={Math.round(stars) === n}
                                    title={`${n} star${n > 1 ? 's' : ''}`}
                                    onClick={() => onChange(rating !== null && Math.abs(rating - newValue) < 0.001 ? undefined : newValue)}>
                                    ★
                                    <span className="star-fill" style={{width: `${fill * 100}%`}}>★</span>
                                </button>
                            );
                        })}
                    </div>
                    <span className="rating-value">{rating === null ? 'Not rated' : `${Math.round(stars * 10) / 10} / 5  (${rating})`}</span>
                </div>
            );
        }

        // Shows the <game> entry a save would write, fetched from the backend on open
        function XmlPreview({ system, payload }) {
            const [open, setOpen] = React.useState(false);
            const [xml, setXml] = React.useState('');
            const [error, setError] = React.useState(null);
            const payloadKey = JSON.stringify(payload, (k, v) => v instanceof File ? `[file ${v.name}]` : v);

            useEffect(() => {
                if (!open || !system) return;
                let cancelled = false;
                setError(null);
                fetch(`${API_BASE}/api/systems/${encodeURIComponent(system.name)}/games/preview`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: payloadKey,
                }).then(r => r.json()).then(data => {
                    if (cancelled) return;
                    if (data.success) setXml(data.xml);
                    else setError(data.error || 'Preview failed');
                }).catch(err => { if (!cancelled) setError(err.message); });
                return () => { cancelled = true; };
            }, [open, payloadKey, system]);

            return (
                <details style={{marginTop: 16}} onToggle={e => setOpen(e.target.open)}>
                    <summary style={{cursor:'pointer', fontSize: 13, color: 'var(--text-secondary)'}}>Preview the gamelist.xml entry</summary>
                    <div style={{fontSize: 12, color: 'var(--text-secondary)', margin: '8px 0'}}>
                        Exactly what Save writes, including tags RetroManager keeps but doesn't edit. Uploaded files aren't included until they're saved.
                    </div>
                    {error ? (
                        <div style={{color: 'var(--accent-pink)', fontSize: 13}}>{error}</div>
                    ) : (
                        <pre style={{background: 'var(--bg-primary)', border: '1px solid var(--border-color)', borderRadius: 4, padding: 12, fontSize: 12, overflowX: 'auto', whiteSpace: 'pre-wrap', wordBreak: 'break-word', maxHeight: 360, userSelect: 'text'}}>{xml || 'Loading...'}</pre>
                    )}
                </details>
            );
        }

        // Media types shown whole rather than cropped (logos, boxes, posters)
        const CONTAIN_MEDIA = new Set(['wheel', 'box2d', 'box3d', 'boxside', 'posters', 'images']);

        function MediaUpload({ label, url, mediaType, onUpload, accept, onImageClick }) {

        // Library health: every system's Scan results in one table
        const HEALTH_COLUMNS = [

            { key: 'saves_in_roms', label: 'Saves in ROM folders', help: 'Save files that belong in the saves/savestates folders' },
            { key: 'duplicates', label: 'Duplicates', help: 'The same game more than once' },
            { key: 'name_style', label: 'Name style', help: 'Names not in house style (Star Wars: Rogue Leader - Rogue Squadron II)' },
            { key: 'media_links', label: 'Unlinked media', safe: true, help: 'Media exists but the gamelist doesn’t use it' },
            { key: 'disc_tracks', label: 'Disc track entries', safe: true, help: 'Gamelist entries for a disc’s track files' },
            { key: 'relink', label: 'Wrong file name', help: 'Entries pointing at a nearly identical ROM name' },

        // Link that opens a game in the library (used from Tools panels)
        const gameLink = (system, romPath) => `/?${new URLSearchParams({ system, game: `./${String(romPath).replace(/^\.\//, '')}` })}`;

        // Progress of the background library scrape, polled while it runs
        function useScrapeQueue() {
            const [status, setStatus] = React.useState(null);
            const refresh = React.useCallback(async () => {
                try {
                    const d = await (await fetch(`${API_BASE}/api/scrape-queue`)).json();
                    if (d.success) setStatus(d);
                    return d;
                } catch (e) { return null; }
            }, []);
            useEffect(() => {
                let timer;
                const tick = async () => {
                    const d = await refresh();
                    timer = setTimeout(tick, d && d.running ? 3000 : 60000);
                };
                tick();
                return () => clearTimeout(timer);
            }, [refresh]);
            return [status, refresh];
        }

        // Scrape every system in the background: confident matches are applied,
        // the rest are listed for review
        function LibraryScrapePanel({ status, refresh, onClose, onChanged }) {
            const [includeMedia, setIncludeMedia] = React.useState(false);
            const [media, setMedia] = React.useState(() => Object.fromEntries(BULK_MEDIA.map(m => [m.key, true])));
            const [recheck, setRecheck] = React.useState(false);
            const [error, setError] = React.useState(null);
            const [open, setOpen] = React.useState({ review: true });
            const wasRunning = useRef(false);

            useEffect(() => {
                if (wasRunning.current && status && !status.running) onChanged && onChanged();
                wasRunning.current = !!status?.running;
            }, [status?.running]);

            const start = async () => {
                setError(null);
                const d = await postJson('/api/scrape-queue/start', {
                    include_media: includeMedia, recheck,
                    media: BULK_MEDIA.filter(m => media[m.key]).map(m => m.key),

                if (!d.success) setError(d.error || 'Could not start');
                refresh();
            };
            const stop = async () => { await postJson('/api/scrape-queue/stop', {}); refresh(); };

            const s = status || {};
            const pct = s.total ? Math.round((s.done / s.total) * 100) : 0;
            const hasResults = (s.applied || []).length || (s.review || []).length || (s.failed || []).length;

            const list = (key, title, items, render) => items.length > 0 && (
                <div style={{marginTop: 12}}>

                        <span style={{color: 'var(--text-secondary)', marginRight: 6}}>{open[key] ? '▾' : '▸'}</span>{title} ({items.length})
                    </button>
                    {open[key] && (
                        <div style={{display: 'flex', flexDirection: 'column', gap: 4, marginTop: 4, maxHeight: 320, overflowY: 'auto'}}>
                            {items.map((item, i) => (
                                <div key={i} style={{display: 'flex', gap: 10, alignItems: 'center', padding: '6px 8px', background: 'var(--bg-tertiary)', borderRadius: 4, fontSize: 13}}>

            return (
                <Modal open={true} onClose={onClose}>
                    <h2 style={{marginBottom: 4}}>Library scrape</h2>
                    <div style={{color: 'var(--text-secondary)', fontSize: 13, marginBottom: 16, maxWidth: 640}}>
                        Scrapes every system from ScreenScraper in the background; you can close this and keep using the app.
                        Confident matches fill empty fields and add media a game doesn't have yet. Uncertain ones are listed for you to check.
                        Each gamelist is backed up before its first change.
                    </div>

                    {s.running ? (
                        <div>
                            <div style={{height: 8, background: 'var(--bg-tertiary)', borderRadius: 4, overflow: 'hidden', marginBottom: 8}}>
                                <div style={{height: '100%', width: `${pct}%`, background: 'var(--accent-pink)', transition: 'width .3s'}} />
                            </div>
                            <div style={{fontSize: 13, marginBottom: 12}}>
                                {s.done} of {s.total} · {(s.applied || []).length} filled · {(s.review || []).length} to review
                                {s.current && <div style={{color: 'var(--text-secondary)', marginTop: 4}}>Now: {s.current.name} ({s.current.system_name})</div>}
                            </div>
                            <button className="btn btn-secondary" onClick={stop} disabled={s.stopping}>{s.stopping ? 'Stopping after this game...' : 'Stop'}</button>
                        </div>
                    ) : (
                        <div>
                            <label style={{display: 'flex', gap: 8, alignItems: 'center', fontSize: 14, marginBottom: 8}}>
                                <input type="checkbox" checked disabled /> Games missing metadata
                            </label>
                            <label style={{display: 'flex', gap: 8, alignItems: 'center', fontSize: 14, marginBottom: 8}}>
                                <input type="checkbox" checked={includeMedia} onChange={e => setIncludeMedia(e.target.checked)} /> Also games that have metadata but are missing media
                            </label>
                            <div style={{display: 'flex', flexWrap: 'wrap', gap: '6px 14px', margin: '4px 0 12px 24px', fontSize: 13}}>
                                {BULK_MEDIA.map(m => (
                                    <label key={m.key} style={{display: 'flex', gap: 6, alignItems: 'center'}}>

                            <label style={{display: 'flex', gap: 8, alignItems: 'center', fontSize: 13, marginBottom: 16, color: 'var(--text-secondary)'}}>

                                    Last run finished {new Date(s.finished).toLocaleString()}: {s.done} of {s.total} checked

                                </div>

                    {hasResults ? (
                        <div style={{marginTop: 8}}>
                            {list('review', 'Needs a look', s.review || [], item => item.match
                                ? <>best guess <b>{item.match.nom}</b>{item.match.year ? ` (${item.match.year})` : ''} · <span style={{color: CONFIDENCE[item.confidence]?.color}}>{CONFIDENCE[item.confidence]?.label}</span></>
                                : 'no match found')}
                            {list('applied', 'Filled', s.applied || [], item => [
                                item.filled?.length ? `${item.filled.length} field${item.filled.length > 1 ? 's' : ''}` : null,
                                item.downloaded?.length ? item.downloaded.map(mediaSourceLabel).join(', ') : null,
                            ].filter(Boolean).join(' · ') || 'nothing new')}

                        </div>
                    ) : null}
                </Modal>
            );
        }

        const thumbUrl = (height, mediaPath) => `${API_BASE}/api/thumb/${height}/${String(mediaPath).split('/').map(encodeURIComponent).join('/')}`;

        // Which games lack which media: per-system counts, then a grid for one system
        function MissingMediaPanel({ onClose, onScrape }) {
            const [overview, setOverview] = React.useState(null);
            const [folders, setFolders] = React.useState([]);
            const [system, setSystem] = React.useState(null);
            const [detail, setDetail] = React.useState(null);
            const [filter, setFilter] = React.useState('box2d');
            const [error, setError] = React.useState(null);

            useEffect(() => {
                fetch(`${API_BASE}/api/missing-media`).then(r => r.json())
                    .then(d => { if (d.success) { setOverview(d.systems); setFolders(d.folders); } else setError(d.error); })
                    .catch(e => setError(e.message));
            }, []);
            useEffect(() => {
                if (!system) return;
                setDetail(null);
                fetch(`${API_BASE}/api/missing-media?system=${encodeURIComponent(system)}`).then(r => r.json())
                    .then(d => d.success ? setDetail(d.systems[0]) : setError(d.error))
                    .catch(e => setError(e.message));
            }, [system]);

            const scrapeable = new Set(BULK_MEDIA.map(m => m.key));
            const startScrape = async (media) => {
                const d = await postJson('/api/scrape-queue/start', { systems: [system], include_media: true, media });
                if (d.success) onScrape && onScrape(); else setError(d.error || 'Could not start the scrape');
            };

            const countCell = (n, total) => (
                <span style={{color: !n ? 'var(--success)' : n === total ? 'var(--accent-pink)' : 'var(--accent-orange)', fontWeight: n ? 600 : 400}}>
                    {n ? n : '✓'}
                </span>
            );

            let body;
            if (error) body = <div style={{color: 'var(--accent-pink)'}}>{error}</div>;
            else if (!overview) body = <div style={{color: 'var(--text-secondary)'}}>Checking every system...</div>;
            else if (!system) body = (
                <div style={{overflowX: 'auto'}}>
                    <table style={{width: '100%', borderCollapse: 'collapse', fontSize: 13}}>
                        <thead>
                            <tr style={{borderBottom: '1px solid var(--border-color)', color: 'var(--text-secondary)'}}>
                                <th style={{textAlign: 'left', padding: '8px 6px'}}>System</th>
                                <th style={{padding: '8px 6px', fontWeight: 500}}>Games</th>
                                {folders.map(f => <th key={f} style={{padding: '8px 6px', fontWeight: 500}}>{mediaSourceLabel(f)}</th>)}
                            </tr>
                        </thead>
                        <tbody>
                            {overview.map(s => (
                                <tr key={s.system} onClick={() => setSystem(s.system)} style={{borderBottom: '1px solid var(--border-color)', cursor: 'pointer'}}
                                    title={`Show ${s.full_name}'s games`}>
                                    <td style={{padding: '8px 6px', whiteSpace: 'nowrap'}}>{s.full_name}</td>

                                    {folders.map(f => <td key={f} style={{padding: '8px 6px', textAlign: 'center'}}>{countCell(s.missing[f], s.total)}</td>)}

                        </tbody>

                    <div style={{fontSize: 12, color: 'var(--text-secondary)', marginTop: 8}}>Numbers are games missing that media. Click a system to see them.</div>

            else {

                body = (
                    <>
                        <div style={{display: 'flex', gap: 8, alignItems: 'center', flexWrap: 'wrap', marginBottom: 12}}>
