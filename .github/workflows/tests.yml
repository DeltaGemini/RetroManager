# The tests, on every push and pull request: the API's (tests/), the
# pages' in a real browser against a demo library of made-up games
# (tests/e2e/), again on the pages as the image builds them, the phone app's
# decisions (android/test.sh), lint, and that the plain JavaScript parses. A release (release.yml) is only made from a tagged version.
name: Tests

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: What RetroManager and its tests need
        run: |
          pip install -r backend/requirements.txt pytest playwright
          python -m playwright install --with-deps chromium

      - name: Lint (ruff, with Pyflakes' checks; see ruff.toml)
        run: |
          pip install ruff
          ruff check .

      - name: Run the tests
        run: python -m pytest tests -q

      # The pages as the image has them (tools/build_frontend.js, as the Dockerfile runs it: each page's
      # code compiled into one file), in a copy, and the browser tests again on those
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      # The pages' plain JavaScript (their own scripts, common/, the service worker) parses
      - name: The plain JavaScript parses
        run: for f in frontend/*.js frontend/common/*.js; do node --check "$f" || exit 1; done
      - name: The pages built as the image builds them, and tested
        run: |
          build=$(mktemp -d) && copy=$(mktemp -d)
          cp tools/build_frontend.js "$build/"
          (cd "$build" && npm install --no-save --no-audit --no-fund $(cat "$GITHUB_WORKSPACE/tools/frontend-build-packages.txt"))
          cp -r backend frontend tests tools ruff.toml "$copy/"
          node "$build/build_frontend.js" "$copy/frontend"
          cd "$copy" && python -m pytest tests/e2e -q

      # The phone app's plain decisions (android/src/.../Decide.java), with the runner's own JDK
      - name: The phone app's tests
        run: bash android/test.sh
