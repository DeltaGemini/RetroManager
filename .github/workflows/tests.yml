# The tests, on every push and pull request: the API's (tests/), the
# pages' in a real browser against a demo library of made-up games
# (tests/e2e/), the phone app's decisions (android/test.sh), and lint. A release (release.yml) is only made from a tagged version.
name: Tests

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: What RetroManager and its tests need
        run: |
          pip install -r backend/requirements.txt pytest playwright
          python -m playwright install --with-deps chromium

      - name: Lint (ruff, with Pyflakes' checks; see ruff.toml)
        run: |
          pip install ruff
          ruff check .

      - name: Run the tests
        run: python -m pytest tests -q

      # The phone app's plain decisions (android/src/.../Decide.java), with the runner's own JDK
      - name: The phone app's tests
        run: android/test.sh
