# The tests, on every push and pull request: the API's (tests/), and the
# pages' in a real browser against a demo library of made-up games
# (tests/e2e/). A release (release.yml) is only made from a tagged version.
name: Tests

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: What RetroManager and its tests need
        run: |
          pip install -r backend/requirements.txt pytest playwright
          python -m playwright install --with-deps chromium

      - name: Run the tests
        run: python -m pytest tests -q
