# A release: when a version is tagged (v1.2.3), the image is built for PCs and
# for 64-bit Raspberry Pis and published to GitHub's registry, and a release is
# made with the Android app attached.
#
# The app isn't built here: it has to be signed with its maker's own key, which
# stays with them. It's built beforehand (android/build.sh) and comes in the
# repository at frontend/app/, which is also where the image serves it from to
# phones that ask whether there's a newer one.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The release's notes: the notice, then this version's section of CHANGELOG.md (its big
      # changes and the bugs fixed). A version with no section there isn't released (checked first, before anything is published).
      - name: The release notes
        id: notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          awk -v v="$version" '
            /^## / { on = (index($0, "## " v " ") == 1 || $0 == "## " v); next }
            on' CHANGELOG.md > section.md
          if ! grep -q '[^[:space:]]' section.md; then
            echo "CHANGELOG.md has no section for $version: add its big changes and bugs fixed first." >&2
            exit 1
          fi
          {
            echo "**No games or media included.** RetroManager organises a game library you already have. It does not supply, link to or help obtain ROMs, BIOS files, disc images, or game artwork, screenshots or videos. Any games shown in pictures of RetroManager are for illustration only and belong to their publishers. See [CREDITS.md](${{ github.server_url }}/${{ github.repository }}/blob/${{ github.ref_name }}/CREDITS.md) for what is included and under which terms."
            echo
            cat section.md
          } > notes.md

      - name: The image's name (lower case, as the registry wants it)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish the image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.ref_name }}
            ${{ env.IMAGE }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.licenses=MIT

      - name: The app, named by its version
        id: app
        run: |
          if [ -f frontend/app/RetroManager.apk ]; then
            name="RetroManager-$(sed -n 's/.*"name": *"\([^"]*\)".*/\1/p' frontend/app/version.json).apk"
            cp frontend/app/RetroManager.apk "$name"
            echo "file=$name" >> "$GITHUB_OUTPUT"
          fi

      - name: Make the release
        uses: softprops/action-gh-release@v3
        with:
          name: RetroManager ${{ steps.notes.outputs.version }}
          generate_release_notes: true
          files: ${{ steps.app.outputs.file }}
          body_path: notes.md
