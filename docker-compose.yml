services:
  retromanager:
    build: .
    container_name: retromanager
    ports:
      - "${PORT:-5000}:5000"
    volumes:
      # Where the library is on this machine. With nothing set it's a folder
      # called RetroGames beside this file, made the first time, which is all a
      # new library needs. To use folders you already have, say where in a .env
      # file beside this one (copy .env.example; .env isn't kept in git):
      #
      # RETRO_DIR is one folder that holds roms/, media/, saves/... A folder
      # that's somewhere else (another share on a NAS, say) has a setting of
      # its own, which is used instead when it's set: ROMS_DIR, MEDIA_DIR,
      # SAVES_DIR, SAVESTATES_DIR, BIOS_DIR, INBOX_DIR, RETROMANAGER_DIR and
      # SAVE_BACKUPS_DIR.
      - ${ROMS_DIR:-${RETRO_DIR:-./RetroGames}/roms}:/roms
      - ${MEDIA_DIR:-${RETRO_DIR:-./RetroGames}/media}:/media
      # Saves are writable so Syncthing conflicts can be resolved (the version not
      # kept is moved to save-backups, never deleted). Add :ro to only view them.
      - ${SAVES_DIR:-${RETRO_DIR:-./RetroGames}/saves}:/saves
      - ${SAVESTATES_DIR:-${RETRO_DIR:-./RetroGames}/savestates}:/savestates
      # BIOS files, for systems that need one to play in the browser or on a phone (optional)
      - ${BIOS_DIR:-${RETRO_DIR:-./RetroGames}/BIOS}:/bios:ro
      # New games: drop files here (in a subfolder named after the system to skip
      # choosing it) and add them from the Add games page. Uploads are staged here too.
      - ${INBOX_DIR:-${RETRO_DIR:-./RetroGames}/inbox}:/inbox
      # RetroManager's own files (settings, library-scrape memory, duplicates moved
      # aside), outside the synced ROM folders
      - ${RETROMANAGER_DIR:-${RETRO_DIR:-./RetroGames}/retromanager}:/data
      # Zipped save backups and versions set aside when resolving conflicts
      - ${SAVE_BACKUPS_DIR:-${RETRO_DIR:-./RetroGames}/save-backups}:/save-backups
    environment:
      - ROMS_PATH=/roms
      - MEDIA_PATH=/media
      - SAVES_PATH=/saves
      - SAVESTATES_PATH=/savestates
      - SAVE_BACKUP_PATH=/save-backups
      - INBOX_PATH=/inbox
      - DATA_PATH=/data
      # (told to the first-run page, to say where the library is on this machine)
      - LIBRARY_ON_HOST=${RETRO_DIR:-./RetroGames}
      - BIOS_PATH=/bios
      # Scaled pictures for the Bookcase and Timeline, kept across updates
      - THUMB_DIR=/data/thumbs
      # People to start with, each with a folder inside saves/ and savestates/.
      # None is usual: they're added in the app (Tools > Profiles and login).
      - SAVE_PROFILES=${SAVE_PROFILES:-}
      # Accounts and keys for the scraping sources (ScreenScraper, IGDB,
      # RetroAchievements, SteamGridDB) are set in the app: Tools > Settings.
      # They're kept in settings.json in the /data folder above.
    restart: unless-stopped
    networks:
      - retromanager-net

networks:
  retromanager-net:
    driver: bridge
